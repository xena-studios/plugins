name: Feature request
description: An idea for xUtilities, zChat or xLimbo.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Each plugin does one job and costs next to nothing to run, so ideas that fit that job, and can be switched off, are the likeliest to land.
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - xUtilities
        - zChat
        - xLimbo
        - More than one
        - A new plugin
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem on your server, not the solution yet. Who runs into it, and how often?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you'd like it to work. Commands, permissions and config are all welcome.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: Another plugin, a workaround, or nothing.
