# Labels for pull requests, by the files they change (actions/labeler, in labels.yml).
# catalog:start: a label per plugin, from the brand catalog (pnpm catalog in docs/).
xutilities:
  - changed-files:
      - any-glob-to-any-file: xutilities/**
zchat:
  - changed-files:
      - any-glob-to-any-file: zchat/**
xlimbo:
  - changed-files:
      - any-glob-to-any-file: xlimbo/**
xrewind:
  - changed-files:
      - any-glob-to-any-file: xrewind/**
xplots:
  - changed-files:
      - any-glob-to-any-file: xplots/**
xteleport:
  - changed-files:
      - any-glob-to-any-file: xteleport/**
xvote:
  - changed-files:
      - any-glob-to-any-file: xvote/**
xbans:
  - changed-files:
      - any-glob-to-any-file: xbans/**
xmoney:
  - changed-files:
      - any-glob-to-any-file: xmoney/**
xstats:
  - changed-files:
      - any-glob-to-any-file: xstats/**
xbackup:
  - changed-files:
      - any-glob-to-any-file: xbackup/**
# catalog:end
core:
  - changed-files:
      - any-glob-to-any-file: [core/**, build-logic/**, gradle/**, "*.gradle.kts", gradle.properties, scripts/**]
api:
  - changed-files:
      - any-glob-to-any-file: "*/api/**"
documentation:
  - changed-files:
      - any-glob-to-any-file: [docs/**, "**/*.md"]
