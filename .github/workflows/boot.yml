name: Boot

# The rewrite's boot matrix (ROADMAP.md, "Build, CI and releases"): xSample, the core's sample
# plugin, and each rewritten plugin (xUtilities, zChat, xMoney, xTeleport, xBans, xVanish, xMarket, xVote, xBackup, xRewind, xLimits and xLimbo, Paper only) on real servers of every platform they ship
# for, and the family test, xSample, xTwin and the rewritten plugins on one server. The Plugins workflow
# boots today's plugins; this one boots the rewrite.
#
# Per pull request, the platforms it touches (scripts/affected.sh's `boot`: a change in core/
# or the samples) at their floor and newest: Spigot 1.8.8 and Paper for Bukkit, the oldest and
# newest lines for Fabric, with the family test on the newest of each and Spigot 1.8.8 (on Java 8,
# then 21), and a real client joining Spigot 1.8.8 and Paper 1.21.11, the newest Minecraft mineflayer speaks, and
# Fabric 1.20.1 and 1.21.11 (mineflayer can't join 26.3 yet: decisions/2026-11-27-real-clients-on-fabric.md);
# NeoForge's oldest and newest lines, a real client on the oldest and the family test on the newest;
# for the proxies, Velocity's floor (3.4.0) and newest and BungeeCord, the newest Velocity in
# front of Paper 1.21.11 and BungeeCord in front of Spigot 1.8.8 with a real client joining
# through the proxy (scripts/boot-proxy.sh). The whole matrix nightly and by hand, Waterfall
# among it. Pull requests always run, so `boot-ok` always reports.
on:
  pull_request:
  schedule:
    # Nightly. It also keeps the server caches warm for pull requests, which can read the
    # default branch's caches.
    - cron: "23 3 * * *"
  workflow_dispatch:

# Each job asks for what it needs, and none can write.
permissions: {}

# With pipefail, so a script piped to tee fails its step.
defaults:
  run:
    shell: bash

concurrency:
  # A new push to a pull request cancels the run it replaces.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which cells run: every one, or a pull request's platforms at their floor and newest.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bukkit: ${{ steps.matrix.outputs.bukkit }}
      fabric: ${{ steps.matrix.outputs.fabric }}
      neoforge: ${{ steps.matrix.outputs.neoforge }}
      proxy: ${{ steps.matrix.outputs.proxy }}
    steps:
      - uses: actions/checkout@v7
      # As the Plugins workflow: the changed files from the files API, everything if that fails.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ $GITHUB_EVENT_NAME != pull_request ]]; then scripts/affected.sh --all | tee -a "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)') \
            || { scripts/affected.sh --all | tee -a "$GITHUB_OUTPUT"; exit 0; }
          scripts/affected.sh <<< "$files" | tee -a "$GITHUB_OUTPUT"
      # The matrix, one cell per server. A cell's `pr` puts it in pull requests' runs, `family`
      # adds the family test, `client` a real client joining (scripts/budgets/bots/client.js, on
      # a version mineflayer speaks), `newest-java` the family test once more on a newer Java than
      # the cell's own, with a real client on a `client` cell, and `allow-failure` lets it fail without failing the run,
      # for a server with no stable download. A fork's version is its own newest unless given.
      - id: matrix
        env:
          BOOT: ${{ steps.check.outputs.boot }}
          FULL: ${{ github.event_name != 'pull_request' }}
        run: |
          # The newest Minecraft CI boots (scripts/new-minecraft.sh moves it), and Fabric's
          # oldest and newest lines, from platform-fabric's Stonecutter versions.
          newest=$(sed -n 's/^xena\.ciNewestMinecraft=//p' gradle.properties)
          read -r -a lines <<< "$(sed -n 's/^ *versions(\(.*\))/\1/p' core/platform-fabric/settings.gradle.kts | tr -d '",')"
          fabric_oldest=${lines[0]} fabric_newest=${lines[-1]}
          java_for() { case $1 in 1.20 | 1.20.[1-4]) echo 17 ;; 1.*) echo 21 ;; *) echo 25 ;; esac; }
          # Forks boot with the jar of the platform they come from. ShreddedPaper and Canvas are
          # Folia's (`regions`: the core must take Folia's path). Canvas has no stable download:
          # its API (api.canvasmc.io) has been down, and its Jenkins builds carry no checksums
          # (scripts/server-jar.sh), so it may fail alone. Waterfall isn't here: it boots the
          # proxy cells below, with the BungeeCord adapter.
          bukkit=$(jq -nc --arg newest "$newest" '[
            {id: "paper", name: "Paper \($newest)", server: "paper", version: $newest, pr: true, family: true},
            {id: "paper-1.21.11", name: "Paper 1.21.11", server: "paper", version: "1.21.11", pr: true, client: true},
            {id: "folia", name: "Folia \($newest)", server: "folia", version: $newest},
            {id: "spigot-1.8.8", name: "Spigot 1.8.8", server: "spigot", version: "1.8.8", buildtools: 8, pr: true, family: true, client: true, "newest-java": 21},
            {id: "spigot-1.13.2", name: "Spigot 1.13.2", server: "spigot", version: "1.13.2", buildtools: 8, pr: true},
            {id: "spigot-1.16.5", name: "Spigot 1.16.5", server: "spigot", version: "1.16.5", buildtools: 8},
            {id: "spigot", name: "Spigot \($newest)", server: "spigot", version: $newest, buildtools: 25},
            {id: "pandaspigot", name: "PandaSpigot 1.8.8", server: "pandaspigot", version: "1.8.8"},
            {id: "leaf", name: "Leaf", server: "leaf", seed: "scripts/boot-seeds/leaf"},
            {id: "leaves", name: "Leaves", server: "leaves"},
            {id: "shreddedpaper", name: "ShreddedPaper", server: "shreddedpaper", regions: true},
            {id: "canvas", name: "Canvas", server: "canvas", regions: true, "allow-failure": true}
          ] | map({version: "", buildtools: 0, pr: false, family: false, client: false, seed: "", regions: false, "newest-java": 0, "allow-failure": false} + .)')
          # Quilt runs the newest line's Fabric jar through its own loader and installer. Real
          # clients join the oldest line and 1.21.11, the newest mineflayer speaks (it can't join
          # 26.x past 26.1 yet, so the newest line has none).
          fabric=$(jq -nc --arg oldest "$fabric_oldest" --arg newest "$fabric_newest" \
            --argjson oldJava "$(java_for "$fabric_oldest")" --argjson newJava "$(java_for "$fabric_newest")" '[
            {id: "fabric-\($oldest)", name: "Fabric \($oldest)", loader: "fabric", version: $oldest, java: $oldJava, pr: true, client: true},
            {id: "fabric-1.21.11", name: "Fabric 1.21.11", loader: "fabric", version: "1.21.11", java: 21, pr: true, client: true},
            {id: "fabric-\($newest)", name: "Fabric \($newest)", loader: "fabric", version: $newest, java: $newJava, pr: true, family: true},
            {id: "quilt-\($newest)", name: "Quilt \($newest)", loader: "quilt", version: $newest, java: $newJava}
          ] | map({pr: false, family: false, client: false, "allow-failure": false} + .)')
          # NeoForge's oldest and newest lines, from platform-neoforge's Stonecutter versions, and
          # 1.21.11 between them, with real clients on the 1.21 lines, as on Fabric, and the family
          # test on the newest (decisions/2026-11-28-neoforge-and-forge.md).
          read -r -a neo_lines <<< "$(sed -n 's/^ *versions(\(.*\))/\1/p' core/platform-neoforge/settings.gradle.kts | tr -d '",')"
          neo_oldest=${neo_lines[0]} neo_newest=${neo_lines[-1]}
          neoforge=$(jq -nc --arg oldest "$neo_oldest" --arg newest "$neo_newest" \
            --argjson oldJava "$(java_for "$neo_oldest")" --argjson newJava "$(java_for "$neo_newest")" '[
            {id: "neoforge-\($oldest)", name: "NeoForge \($oldest)", version: $oldest, java: $oldJava, pr: true, client: true},
            {id: "neoforge-1.21.11", name: "NeoForge 1.21.11", version: "1.21.11", java: 21, client: true},
            {id: "neoforge-\($newest)", name: "NeoForge \($newest)", version: $newest, java: $newJava, pr: true, family: true}
          ] | map({pr: false, family: false, client: false, "allow-failure": false} + .)')
          # The proxies: each boots xSample's proxy side alone, with its startup against the
          # first-plugin budget; a cell with a `backend` also runs the pair test, xSample on that
          # backend behind the proxy and a real client joining through it. Velocity's newest
          # (4.x, on Java 25) and its floor (3.4.0, the first on Java 21); BungeeCord's last good
          # build; Waterfall, which has reached its end, boot only and nightly (#162).
          proxy=$(jq -nc '[
            {id: "velocity", name: "Velocity", proxy: "velocity", side: "velocity", backend: "paper", "backend-version": "1.21.11", pr: true},
            {id: "velocity-3.4.0", name: "Velocity 3.4.0", proxy: "velocity", side: "velocity", version: "3.4.0", pr: true},
            {id: "bungeecord", name: "BungeeCord", proxy: "bungeecord", side: "bungee", backend: "spigot", "backend-version": "1.8.8", buildtools: 8, pr: true},
            {id: "waterfall", name: "Waterfall", proxy: "waterfall", side: "bungee"}
          ] | map({version: "", backend: "", "backend-version": "", buildtools: 0, pr: false, "allow-failure": false} + .)')
          # A pull request runs its platforms' `pr` cells; nightly and by hand, all of them.
          pick() {
            if [[ $FULL == true ]]; then echo "$2"
            elif [[ " $BOOT " == *" $1 "* ]]; then jq -c 'map(select(.pr))' <<< "$2"
            else echo "[]"
            fi
          }
          echo "bukkit=$(pick bukkit "$bukkit")" | tee -a "$GITHUB_OUTPUT"
          echo "fabric=$(pick fabric "$fabric")" | tee -a "$GITHUB_OUTPUT"
          echo "neoforge=$(pick neoforge "$neoforge")" | tee -a "$GITHUB_OUTPUT"
          echo "proxy=$(pick proxy "$proxy")" | tee -a "$GITHUB_OUTPUT"

  # xSample's, xTwin's, xUtilities', zChat's, xMoney's, xTeleport's and xBans' Bukkit jars (with xMoney's
  # two test plugins), once for every Bukkit cell.
  build-bukkit:
    needs: changes
    if: needs.changes.outputs.bukkit != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # assemble shrinks each jar with R8 (build/r8/); checkJarBudget fails one over its line in
      # gradle/jar-budgets.txt.
      - run: >-
          ./gradlew :core:core-testing:sample:bukkit:assemble :core:core-testing:twin:bukkit:assemble :xutilities:bukkit:assemble :zchat:bukkit:assemble
          :xmoney:bukkit:assemble :xmoney:vault-consumer:assemble :xmoney:hook-consumer:assemble :xteleport:bukkit:assemble :xbans:bukkit:assemble :xvanish:bukkit:assemble :xmarket:bukkit:assemble :xvote:bukkit:assemble :xbackup:bukkit:assemble :xrewind:bukkit:assemble :xlimits:bukkit:assemble :xlimbo:bukkit:assemble :xplots:bukkit:assemble :xstats:bukkit:assemble
          :core:core-testing:sample:bukkit:checkJarBudget :core:core-testing:twin:bukkit:checkJarBudget :xutilities:bukkit:checkJarBudget :zchat:bukkit:checkJarBudget
          :xmoney:bukkit:checkJarBudget :xteleport:bukkit:checkJarBudget :xbans:bukkit:checkJarBudget :xvanish:bukkit:checkJarBudget :xmarket:bukkit:checkJarBudget :xvote:bukkit:checkJarBudget :xbackup:bukkit:checkJarBudget :xrewind:bukkit:checkJarBudget :xlimits:bukkit:checkJarBudget :xlimbo:bukkit:checkJarBudget :xplots:bukkit:checkJarBudget :xstats:bukkit:checkJarBudget
      - uses: actions/upload-artifact@v7
        with:
          name: bukkit-jars
          # The R8 jars, kept at their paths from the repo's root, where each boot.sh looks.
          path: |
            core/core-testing/sample/bukkit/build/r8/XSample.jar
            core/core-testing/twin/bukkit/build/r8/XTwin.jar
            xutilities/bukkit/build/r8/xUtilities.jar
            zchat/bukkit/build/r8/zChat.jar
            xmoney/bukkit/build/r8/xMoney.jar
            xmoney/vault-consumer/build/libs/vault-consumer.jar
            xmoney/hook-consumer/build/libs/hook-consumer.jar
            xteleport/bukkit/build/r8/xTeleport.jar
            xbans/bukkit/build/r8/xBans.jar
            xvanish/bukkit/build/r8/xVanish.jar
            xmarket/bukkit/build/r8/xMarket.jar
            xvote/bukkit/build/r8/xVote.jar
            xbackup/bukkit/build/r8/xBackup.jar
            xrewind/bukkit/build/r8/xRewind.jar
            xlimits/bukkit/build/r8/xLimits.jar
            xlimbo/bukkit/build/r8/xLimbo.jar
            xplots/bukkit/build/r8/xPlots.jar
            xstats/bukkit/build/r8/xStats.jar
          if-no-files-found: error

  # platform-fabric's own build (DECISIONS.md: a build of its own, which the root build and the
  # Plugins workflow don't configure): its tests, and xSample's and xTwin's jar for every line.
  build-fabric:
    needs: changes
    if: needs.changes.outputs.fabric != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Java 25 runs Gradle; the 1.20.1 and 1.21.11 lines compile on 17 and 21 through toolchains.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Loom's Minecraft jars, mappings and remapped mods, set up for every line while the build
      # is configured: minutes cold. Keyed on what decides them.
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/fabric-loom
          key: fabric-loom-${{ hashFiles('core/platform-fabric/settings.gradle.kts', 'core/platform-fabric/stonecutter.properties.toml') }}
          restore-keys: fabric-loom-
      - run: ./gradlew -p core/platform-fabric build collect
      - uses: actions/upload-artifact@v7
        with:
          name: fabric-jars
          path: core/platform-fabric/build/libs/*.jar
          if-no-files-found: error

  # platform-neoforge's own build, as platform-fabric's: its tests, and xSample's, xTwin's and the
  # rewritten plugins' NeoForge jars for every line.
  build-neoforge:
    needs: changes
    if: needs.changes.outputs.neoforge != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Java 25 runs Gradle; the 1.21 lines compile on 21 through toolchains.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # ModDevGradle's NeoForm runs (Minecraft decompiled and patched with NeoForge's changes) for
      # every line, set up while the build is configured: minutes cold. Keyed on what decides them.
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/neoformruntime
          key: neoformruntime-${{ hashFiles('core/platform-neoforge/settings.gradle.kts', 'core/platform-neoforge/stonecutter.properties.toml') }}
          restore-keys: neoformruntime-
      - run: ./gradlew -p core/platform-neoforge build collect
      - uses: actions/upload-artifact@v7
        with:
          name: neoforge-jars
          path: core/platform-neoforge/build/libs/*.jar
          if-no-files-found: error

  # xSample's, zChat's, xBans', xVote's and xStats' proxy jars, and their Bukkit jars for the backends, once for every proxy cell.
  build-proxy:
    needs: changes
    if: needs.changes.outputs.proxy != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - run: >-
          ./gradlew :core:core-testing:sample:velocity:assemble :core:core-testing:sample:bungee:assemble :core:core-testing:sample:bukkit:assemble
          :zchat:velocity:assemble :zchat:bungee:assemble :zchat:bukkit:assemble
          :xbans:velocity:assemble :xbans:bungee:assemble :xbans:bukkit:assemble :xvanish:bukkit:assemble
          :xvote:velocity:assemble :xvote:bungee:assemble :xvote:bukkit:assemble
          :xstats:velocity:assemble :xstats:bukkit:assemble
          :core:core-testing:sample:velocity:checkJarBudget :core:core-testing:sample:bungee:checkJarBudget
          :zchat:velocity:checkJarBudget :zchat:bungee:checkJarBudget :xbans:velocity:checkJarBudget :xbans:bungee:checkJarBudget
          :xvote:velocity:checkJarBudget :xvote:bungee:checkJarBudget :xstats:velocity:checkJarBudget
      - uses: actions/upload-artifact@v7
        with:
          name: proxy-jars
          path: |
            core/core-testing/sample/velocity/build/r8/XSample-Velocity.jar
            core/core-testing/sample/bungee/build/r8/XSample-Bungee.jar
            core/core-testing/sample/bukkit/build/r8/XSample.jar
            zchat/velocity/build/r8/zChat-Velocity.jar
            zchat/bungee/build/r8/zChat-Bungee.jar
            zchat/bukkit/build/r8/zChat.jar
            xbans/velocity/build/r8/xBans-Velocity.jar
            xbans/bungee/build/r8/xBans-Bungee.jar
            xbans/bukkit/build/r8/xBans.jar
            xvanish/bukkit/build/r8/xVanish.jar
            xvote/velocity/build/r8/xVote-Velocity.jar
            xvote/bungee/build/r8/xVote-Bungee.jar
            xvote/bukkit/build/r8/xVote.jar
            xstats/velocity/build/r8/xStats-Velocity.jar
            xstats/bukkit/build/r8/xStats.jar
          if-no-files-found: error

  bukkit:
    needs: [changes, build-bukkit]
    if: needs.changes.outputs.bukkit != '[]'
    runs-on: ubuntu-26.04
    # A cold BuildTools run takes minutes; a hung server fails the job instead of holding a
    # runner for six hours.
    timeout-minutes: 40
    permissions:
      contents: read
    continue-on-error: ${{ matrix.cell.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.changes.outputs.bukkit) }}
    name: boot (${{ matrix.cell.name }})
    env:
      SERVER: ${{ matrix.cell.server }}
      VERSION: ${{ matrix.cell.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bukkit-jars
          path: .
      # What will boot, for the cache key: Paper's and Folia's newest build of the version,
      # which boot-test.sh downloads, or scripts/server-jar.sh's version, build and Java.
      - id: server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $SERVER == paper || $SERVER == folia ]]; then
            build=$(curl -fsS "https://fill.papermc.io/v3/projects/$SERVER/versions/$VERSION/builds/latest" | jq -r .id)
            printf 'version=%s\nbuild=%s\njava=25\n' "$VERSION" "$build" | tee -a "$GITHUB_OUTPUT"
          else
            # No version: the fork's own newest.
            scripts/server-jar.sh --resolve "$SERVER" ${VERSION:+"$VERSION"} | tee -a "$GITHUB_OUTPUT"
          fi
      # Server jars (Spigot's built by BuildTools), Mojang's jar and the libraries they fetch.
      - id: cache
        uses: actions/cache@v6
        with:
          path: .cache/servers
          key: servers-${{ matrix.cell.server }}-${{ steps.server.outputs.version }}-${{ steps.server.outputs.build }}
          restore-keys: servers-${{ matrix.cell.server }}-${{ steps.server.outputs.version }}-
      # BuildTools' own Java, only when the jar isn't cached: 8 for 1.8.8 to 1.16.5.
      - id: buildtools
        if: matrix.cell.server == 'spigot' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.cell.buildtools }}
      - id: jar
        if: matrix.cell.server != 'paper' && matrix.cell.server != 'folia'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDTOOLS_JAVA: ${{ steps.buildtools.outputs.path }}
          RESOLVED: ${{ steps.server.outputs.version }}
        run: scripts/server-jar.sh "$SERVER" "$RESOLVED" | tee -a "$GITHUB_OUTPUT"
      # The newest Java the server accepts: 8 for 1.8.8, 11 for 1.13.2, 16 for 1.16.5.
      - id: java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.server.outputs.java }}
      # The real client's Node.js and mineflayer packages, which boot-test.sh installs into .cache:
      # on a `client` cell, and on Spigot 1.13.2 for xRewind's, whose floor it is.
      - if: matrix.cell.client || matrix.cell.id == 'spigot-1.13.2'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: matrix.cell.client || matrix.cell.id == 'spigot-1.13.2'
        uses: actions/cache@v6
        with:
          path: .cache/budget-bots
          key: client-bots-${{ hashFiles('scripts/budgets/bots/package-lock.json') }}
      # xSample alone: its platform checks, console commands and a clean stop; on a `client` cell
      # also a real client, an operator through the seeded ops.json, joining in German, running
      # and completing commands and switching to English, with its join and quit in the player
      # cache (core/core-testing/sample/bukkit/client-checks.txt).
      - name: boot xSample
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          SEED: ${{ matrix.cell.seed }}
          REGIONS: ${{ matrix.cell.regions }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          args=()
          [[ -z $SEED ]] || args+=(--seed "$SEED")
          # Folia's forks must take Folia's path, not the main thread's.
          [[ $REGIONS != true ]] || args+=(--logged "REGIONS threading")
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks core/core-testing/sample/bukkit/client-checks.txt)
          core/core-testing/sample/bukkit/boot.sh "${target[@]}" --java "$JAVA" "${args[@]}"
      # xUtilities alone: every command family from the console, a reload and debug; on a
      # `client` cell also a real client running /fly, /heal and /back in German, then English
      # (xutilities/bukkit/client-checks.txt).
      - name: boot xUtilities
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          SEED: ${{ matrix.cell.seed }}
          REGIONS: ${{ matrix.cell.regions }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          args=()
          [[ -z $SEED ]] || args+=(--seed "$SEED")
          [[ $REGIONS != true ]] || args+=(--logged "REGIONS threading")
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xutilities/bukkit/client-checks.txt)
          xutilities/bukkit/boot.sh "${target[@]}" --java "$JAVA" "${args[@]}"
      # zChat alone: every command from the console, /filter's edits, a reload and debug; on a
      # `client` cell also two real clients chatting: the format, the filter, a mention and its
      # ping, /msg and /reply, and /togglechat in German (zchat/bukkit/client-checks.txt).
      - name: boot zChat
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          SEED: ${{ matrix.cell.seed }}
          REGIONS: ${{ matrix.cell.regions }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          args=()
          [[ -z $SEED ]] || args+=(--seed "$SEED")
          [[ $REGIONS != true ]] || args+=(--logged "REGIONS threading")
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks zchat/bukkit/client-checks.txt)
          zchat/bukkit/boot.sh "${target[@]}" --java "$JAVA" "${args[@]}"
      # upload-artifact keeps the jars at their paths from the repo's root (their common folder):
      # the check names one that isn't where the boots look, should the artifact's files change.
      - name: Check the Bukkit jars are in place
        run: |
          for jar in xmoney/bukkit/build/r8/xMoney.jar xmoney/vault-consumer/build/libs/vault-consumer.jar \
                     xmoney/hook-consumer/build/libs/hook-consumer.jar zchat/bukkit/build/r8/zChat.jar \
                     xteleport/bukkit/build/r8/xTeleport.jar xbans/bukkit/build/r8/xBans.jar xvanish/bukkit/build/r8/xVanish.jar xmarket/bukkit/build/r8/xMarket.jar \
                     xvote/bukkit/build/r8/xVote.jar \
                     xbackup/bukkit/build/r8/xBackup.jar xrewind/bukkit/build/r8/xRewind.jar \
                     xlimits/bukkit/build/r8/xLimits.jar xlimbo/bukkit/build/r8/xLimbo.jar xstats/bukkit/build/r8/xStats.jar; do
            [[ -f $jar ]] || { echo "::error::$jar is missing: the bukkit-jars artifact landed somewhere else"; find . -name '*.jar' -path '*build/*' | head -20; exit 1; }
          done
      # xMoney beside vault-consumer (a plugin.yml plugin that depends on Vault) and, on Paper and
      # Folia, hook-consumer (today's core's Vault hook): every command, Vault 1 and VaultUnlocked 2
      # from other threads, the importers, a reload and debug; below 1.15.2 beside a real Vault.jar,
      # which boot.sh downloads. On a `family` or `client` cell beside zChat too, its format seeded
      # to show <balance>; on a `client` cell also two real clients, Joiner paying Friend in German
      # and English and Joiner's chat line showing their balance (xmoney/bukkit/zchat-client-checks.txt).
      - name: boot xMoney
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          SEED: ${{ matrix.cell.seed }}
          REGIONS: ${{ matrix.cell.regions }}
          CLIENT: ${{ matrix.cell.client }}
          FAMILY: ${{ matrix.cell.family }}
        run: |
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          # boot.sh takes --zchat right after the server.
          zchat=()
          [[ $CLIENT != true && $FAMILY != true ]] || zchat=(--zchat)
          args=()
          [[ -z $SEED ]] || args+=(--seed "$SEED")
          [[ $REGIONS != true ]] || args+=(--logged "REGIONS threading")
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xmoney/bukkit/zchat-client-checks.txt)
          xmoney/bukkit/boot.sh "${target[@]}" "${zchat[@]}" --java "$JAVA" "${args[@]}"
      # On Paper, beside a real VaultUnlocked jar, which Paper refuses as a duplicate: the one run
      # that allows an error, Paper's own (xmoney/bukkit/boot-checks-vaultunlocked.txt).
      - name: boot xMoney beside VaultUnlocked
        if: matrix.cell.server == 'paper'
        env:
          JAVA: ${{ steps.java.outputs.path }}
        run: xmoney/bukkit/boot.sh "$SERVER" "$VERSION" --vaultunlocked --java "$JAVA"
      # xTeleport alone: three real /rtp searches (the End's on Paper and Folia), the lists, the import's
      # dry run, a reload and debug; on a `client` cell beside xMoney, with /spawn costing 5, and two real
      # clients: a home set and gone back to, Friend's /tpa accepted and Friend arriving after the warmup,
      # an /rtp, and Friend paying for /spawn through xMoney (xteleport/bukkit/xmoney-client-checks.txt).
      - name: boot xTeleport
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          SEED: ${{ matrix.cell.seed }}
          REGIONS: ${{ matrix.cell.regions }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          # boot.sh takes --xmoney right after the server.
          xmoney=()
          [[ $CLIENT != true ]] || xmoney=(--xmoney)
          args=()
          [[ -z $SEED ]] || args+=(--seed "$SEED")
          [[ $REGIONS != true ]] || args+=(--logged "REGIONS threading")
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xteleport/bukkit/xmoney-client-checks.txt)
          xteleport/bukkit/boot.sh "${target[@]}" "${xmoney[@]}" --java "$JAVA" "${args[@]}"
      # xBans alone: every command from the console, a ban's life, the imports' dry runs, a reload and
      # debug; on a `family` or `client` cell beside zChat, which asks xBans who's muted
      # (xbans/bukkit/zchat-checks.txt); on a `client` cell also two real clients: a tempban that
      # kicks Friend and keeps them out until it ends, a mute stopping their chat and zChat's /msg,
      # a kick, and Joiner's replies in German (xbans/bukkit/zchat-client-checks.txt).
      - name: boot xBans
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          SEED: ${{ matrix.cell.seed }}
          REGIONS: ${{ matrix.cell.regions }}
          CLIENT: ${{ matrix.cell.client }}
          FAMILY: ${{ matrix.cell.family }}
        run: |
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          # boot.sh takes --zchat right after the server.
          zchat=()
          [[ $CLIENT != true && $FAMILY != true ]] || zchat=(--zchat)
          args=()
          [[ -z $SEED ]] || args+=(--seed "$SEED")
          [[ $REGIONS != true ]] || args+=(--logged "REGIONS threading")
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xbans/bukkit/zchat-client-checks.txt)
          xbans/bukkit/boot.sh "${target[@]}" "${zchat[@]}" --java "$JAVA" "${args[@]}"
      # xBackup alone: backups with the world pause (per region on Folia; World#save() and a wait for
      # the region files on Spigot), a changed chunk read after the flush, a full check, a staged
      # restore called off, a reload and debug; on a `family` cell beside xMoney and xBans, whose
      # SQLite databases their own writers copy for each backup (xbackup/bukkit/family-checks.txt);
      # on a `client` cell also a real client, Joiner, backing up and staging a restore in German
      # while Friend, no operator, is refused (xbackup/bukkit/client-checks.txt).
      - name: boot xBackup
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          SEED: ${{ matrix.cell.seed }}
          REGIONS: ${{ matrix.cell.regions }}
          CLIENT: ${{ matrix.cell.client }}
          FAMILY: ${{ matrix.cell.family }}
        run: |
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          # boot.sh takes --family right after the server.
          family=()
          [[ $FAMILY != true ]] || family=(--family)
          args=()
          [[ -z $SEED ]] || args+=(--seed "$SEED")
          [[ $REGIONS != true ]] || args+=(--logged "REGIONS threading")
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xbackup/bukkit/client-checks.txt)
          xbackup/bukkit/boot.sh "${target[@]}" "${family[@]}" --java "$JAVA" "${args[@]}"
      # xVanish alone: every command from the console, the import from SuperVanish's data.yml
      # (import-checks.txt), a reload and debug; on a `client` cell beside zChat and xTeleport, with
      # two real clients: Joiner vanishes and Friend finds them nowhere, not in the tab list, the
      # world, xTeleport's /tpa, zChat's mentions and /msg or a completion, even after a relog; then
      # Joiner shows again (xvanish/bukkit/client-checks.txt).
      - name: boot xVanish
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          SEED: ${{ matrix.cell.seed }}
          REGIONS: ${{ matrix.cell.regions }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          # boot.sh takes --family right after the server.
          family=()
          [[ $CLIENT != true ]] || family=(--family)
          args=()
          [[ -z $SEED ]] || args+=(--seed "$SEED")
          [[ $REGIONS != true ]] || args+=(--logged "REGIONS threading")
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xvanish/bukkit/client-checks.txt)
          xvanish/bukkit/boot.sh "${target[@]}" "${family[@]}" --java "$JAVA" "${args[@]}"
      # xMarket alone: the price list written and read back off the server thread, /worth, the audit
      # (every item this version has priced, no loop), the stats, the import's dry run, a reload and
      # debug; on a `client` cell beside xMoney (and Vault below 1.15.2), and a real client clicking
      # /shop's menus through to a purchase xMoney debits, /sell hand that it credits, /shop buy and
      # /worth, in German (xmarket/bukkit/xmoney-client-checks.txt).
      - name: boot xMarket
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          SEED: ${{ matrix.cell.seed }}
          REGIONS: ${{ matrix.cell.regions }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          # boot.sh takes --xmoney right after the server.
          xmoney=()
          [[ $CLIENT != true ]] || xmoney=(--xmoney)
          args=()
          [[ -z $SEED ]] || args+=(--seed "$SEED")
          [[ $REGIONS != true ]] || args+=(--logged "REGIONS threading")
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xmarket/bukkit/xmoney-client-checks.txt)
          xmarket/bukkit/boot.sh "${target[@]}" "${xmoney[@]}" --java "$JAVA" "${args[@]}"
      # xVote alone: test votes through its own receiver's port, the lists, the imports' refusals, a
      # reload and debug; on a `client` cell beside xMoney, with two real clients and real Votifier
      # v2 votes: one for Friend before Friend has ever joined, paid as Friend joins, one for Joiner,
      # paid at once with 25 through xMoney's API, and /vote in German (xvote/bukkit/xmoney-checks.txt).
      - name: boot xVote
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          SEED: ${{ matrix.cell.seed }}
          REGIONS: ${{ matrix.cell.regions }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          # boot.sh takes --xmoney right after the server.
          xmoney=()
          [[ $CLIENT != true ]] || xmoney=(--xmoney)
          args=()
          [[ -z $SEED ]] || args+=(--seed "$SEED")
          [[ $REGIONS != true ]] || args+=(--logged "REGIONS threading")
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client)
          xvote/bukkit/boot.sh "${target[@]}" "${xmoney[@]}" --java "$JAVA" "${args[@]}"
      # xRewind alone, from 1.13 (block data's first version; older cells skip it): the database,
      # every console command, lookups, purges and the import on a real database, and on Paper and
      # Folia TNT's damage logged and rolled back with both halves of a double chest; on a `client`
      # cell and on Spigot 1.13.2, its floor, a real client breaking and placing, a lookup in German,
      # a rollback, an undo and the inspector (xrewind/bukkit/client-checks.txt).
      - name: boot xRewind
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          SEED: ${{ matrix.cell.seed }}
          REGIONS: ${{ matrix.cell.regions }}
          CLIENT: ${{ matrix.cell.client }}
          ID: ${{ matrix.cell.id }}
          RESOLVED: ${{ steps.server.outputs.version }}
        run: |
          if [[ $(printf '%s\n1.13\n' "$RESOLVED" | sort -V | head -1) != 1.13 ]]; then echo "xRewind needs 1.13; this is $RESOLVED"; exit 0; fi
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          args=()
          [[ -z $SEED ]] || args+=(--seed "$SEED")
          [[ $REGIONS != true ]] || args+=(--logged "REGIONS threading")
          [[ $CLIENT != true && $ID != spigot-1.13.2 ]] || args+=(--seed scripts/boot-seeds/client --checks xrewind/bukkit/client-checks.txt)
          xrewind/bukkit/boot.sh "${target[@]}" --java "$JAVA" "${args[@]}"
      # xLimits alone, from 1.13 (its floor; older cells skip it): every console command, the
      # imports from FarmControl's and Insights' files, a reload and debug, with small caps seeded;
      # off Folia's regions, /summon past a cap, refused, with the staff alert (spawn-checks.txt);
      # on a `client` cell and at its floor (Spigot 1.13.2), a real client in German has a spawn
      # egg and a second hopper refused and is told why (xlimits/bukkit/client-checks.txt).
      - name: boot xLimits
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          SEED: ${{ matrix.cell.seed }}
          REGIONS: ${{ matrix.cell.regions }}
          CLIENT: ${{ matrix.cell.client || matrix.cell.id == 'spigot-1.13.2' }}
          RESOLVED: ${{ steps.server.outputs.version }}
        run: |
          if [[ -n $RESOLVED && $(printf '%s\n' "$RESOLVED" 1.13 | sort -V | head -1) != 1.13 ]]; then
            echo "xLimits starts at 1.13; this is $RESOLVED."
            exit 0
          fi
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          args=()
          [[ -z $SEED ]] || args+=(--seed "$SEED")
          [[ $REGIONS != true ]] || args+=(--logged "REGIONS threading")
          [[ $REGIONS != true ]] || export XLIMITS_SPAWNS=false
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xlimits/bukkit/client-checks.txt)
          xlimits/bukkit/boot.sh "${target[@]}" --java "$JAVA" "${args[@]}"
      # xLimbo alone, on Paper from 1.21.11 (it's Paper only; other cells skip it): its world and
      # floor, every console command, a reload and debug; on a `client` cell also a real client
      # landing on the floor in German, the hint, hide-others and /join (xlimbo/bukkit/client-checks.txt).
      - name: boot xLimbo
        env:
          JAVA: ${{ steps.java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
          RESOLVED: ${{ steps.server.outputs.version }}
        run: |
          if [[ $SERVER != paper || $(printf '%s\n1.21.11\n' "$RESOLVED" | sort -V | head -1) != 1.21.11 ]]; then
            echo "xLimbo is Paper only, from 1.21.11; this is $SERVER $RESOLVED."
            exit 0
          fi
          args=()
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xlimbo/bukkit/client-checks.txt)
          xlimbo/bukkit/boot.sh paper "$VERSION" --java "$JAVA" "${args[@]}"
      # xLimbo as a world on the server, with xTeleport and xVanish beside it (send-back.via:
      # teleport), on a `client` cell: a real client sends Friend to limbo and Friend's /join comes
      # back through xTeleport's spawn, a vanished player left out of Friend's count (family-checks.txt).
      - name: boot xLimbo with xTeleport and xVanish
        if: matrix.cell.client && matrix.cell.server == 'paper'
        env:
          JAVA: ${{ steps.java.outputs.path }}
        run: xlimbo/bukkit/boot.sh paper "$VERSION" --family --java "$JAVA" --seed scripts/boot-seeds/client
      # xPlots, from 1.13 (block data's first version, its floor; older cells skip it): a field made
      # with its signs, settings, a plot's info, a reload, debug and the field deleted; with
      # WorldGuard and WorldEdit beside it (pinned, with their sha256) on Paper and Spigot 1.13.2,
      # the field's region (worldguard-checks.txt); on a `family` or `client` cell and at its floor,
      # beside xMoney, xTeleport, xRewind and xVanish, rent through xMoney's ledger and a rollback
      # through xRewind's (family-checks.txt); on a `client` cell and on Spigot 1.13.2 a real client
      # in German rents a plot through its sign and menu, paid through xMoney, has a non-member
      # refused and a member let build, and goes to the plot home through xTeleport's /home
      # (xplots/bukkit/client-checks.txt). WorldGuard doesn't run on Folia or its forks.
      - name: boot xPlots
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          SEED: ${{ matrix.cell.seed }}
          REGIONS: ${{ matrix.cell.regions }}
          KIND: ${{ matrix.cell.server }}
          FAMILY: ${{ matrix.cell.family }}
          CLIENT: ${{ matrix.cell.client || matrix.cell.id == 'spigot-1.13.2' }}
          RESOLVED: ${{ steps.server.outputs.version }}
        run: |
          if [[ -n $RESOLVED && $(printf '%s\n' "$RESOLVED" 1.13 | sort -V | head -1) != 1.13 ]]; then
            echo "xPlots starts at 1.13; this is $RESOLVED."
            exit 0
          fi
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          opts=()
          case "$KIND:$RESOLVED" in paper:1.13* | paper:1.21* | paper:26.* | spigot:1.13*) opts+=(--worldguard) ;; esac
          [[ $FAMILY != true && $CLIENT != true ]] || opts+=(--family)
          args=()
          [[ -z $SEED ]] || args+=(--seed "$SEED")
          [[ $REGIONS != true ]] || args+=(--logged "REGIONS threading")
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xplots/bukkit/client-checks.txt)
          xplots/bukkit/boot.sh "${target[@]}" "${opts[@]}" --java "$JAVA" "${args[@]}"
      # xStats alone, from 1.13 (its floor; older cells skip it): every console command, a save, the
      # website's self-test and export, the import, a reload and debug, and from 1.19.4 a board in the
      # world (board-checks.txt); on a `client` cell beside xMoney, whose stats it keeps
      # (xstats/bukkit/xmoney-checks.txt), and there and at its floor (Spigot 1.13.2) a real client in
      # German: /stats, jumps a save reads, the leaderboard and /stats private (client-checks.txt).
      - name: boot xStats
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          SEED: ${{ matrix.cell.seed }}
          REGIONS: ${{ matrix.cell.regions }}
          CLIENT: ${{ matrix.cell.client }}
          ID: ${{ matrix.cell.id }}
          RESOLVED: ${{ steps.server.outputs.version }}
        run: |
          if [[ -n $RESOLVED && $(printf '%s\n1.13\n' "$RESOLVED" | sort -V | head -1) != 1.13 ]]; then echo "xStats starts at 1.13; this is $RESOLVED."; exit 0; fi
          # Boards are text displays, from 1.19.4.
          [[ -z $RESOLVED || $(printf '%s\n1.19.4\n' "$RESOLVED" | sort -V | head -1) == 1.19.4 ]] || export XSTATS_BOARDS=false
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          # boot.sh takes --xmoney right after the server.
          xmoney=()
          [[ $CLIENT != true ]] || xmoney=(--xmoney)
          args=()
          [[ -z $SEED ]] || args+=(--seed "$SEED")
          [[ $REGIONS != true ]] || args+=(--logged "REGIONS threading")
          [[ $CLIENT != true && $ID != spigot-1.13.2 ]] || args+=(--seed scripts/boot-seeds/client --checks xstats/bukkit/client-checks.txt)
          xstats/bukkit/boot.sh "${target[@]}" "${xmoney[@]}" --java "$JAVA" "${args[@]}"
      # The family test: xTwin, xUtilities, zChat, xTeleport, xBans, xVanish, xMarket, xVote, xBackup, (from 1.13) xRewind, xPlots and xStats and (on Paper from 1.21.11) xLimbo beside xSample, each with its own relocated core,
      # seeing one board, one player cache and plugins/Xena/ (core/core-testing/twin/family-checks.txt),
      # and each answering its own commands.
      - name: family test
        if: matrix.cell.family
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.java.outputs.path }}
          RESOLVED: ${{ steps.server.outputs.version }}
        run: |
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          rewind=()
          [[ $(printf '%s\n1.13\n' "$RESOLVED" | sort -V | head -1) != 1.13 ]] || rewind=(--checks xrewind/bukkit/boot-checks.txt xrewind/bukkit/build/r8/xRewind.jar
            --checks xplots/bukkit/boot-checks.txt xplots/bukkit/build/r8/xPlots.jar)
          # xStats too from 1.13, its floor, keeping the others' stats (xstats/bukkit/family-checks.txt).
          [[ $(printf '%s\n1.13\n' "$RESOLVED" | sort -V | head -1) != 1.13 ]] || rewind+=(--checks xstats/bukkit/boot-checks.txt --checks xstats/bukkit/family-checks.txt xstats/bukkit/build/r8/xStats.jar)
          # xLimbo too on Paper from 1.21.11, its floor (Paper only).
          [[ $SERVER != paper || $(printf '%s\n1.21.11\n' "$RESOLVED" | sort -V | head -1) != 1.21.11 ]] || rewind+=(--checks xlimbo/bukkit/boot-checks.txt xlimbo/bukkit/build/r8/xLimbo.jar)
          core/core-testing/sample/bukkit/boot.sh "${target[@]}" --java "$JAVA" --jvm -Dxena.debug.paste=false \
            --checks core/core-testing/twin/family-checks.txt --checks xutilities/bukkit/boot-checks.txt --checks zchat/bukkit/boot-checks.txt \
            --checks xteleport/bukkit/boot-checks.txt --checks xbans/bukkit/boot-checks.txt --checks xvanish/bukkit/boot-checks.txt --checks xmarket/bukkit/boot-checks.txt \
            --checks xvote/bukkit/boot-checks.txt --checks xbackup/bukkit/boot-checks.txt \
            core/core-testing/twin/bukkit/build/r8/XTwin.jar xutilities/bukkit/build/r8/xUtilities.jar zchat/bukkit/build/r8/zChat.jar \
            xteleport/bukkit/build/r8/xTeleport.jar xbans/bukkit/build/r8/xBans.jar xvanish/bukkit/build/r8/xVanish.jar xmarket/bukkit/build/r8/xMarket.jar \
            xvote/bukkit/build/r8/xVote.jar xbackup/bukkit/build/r8/xBackup.jar \
            "${rewind[@]}"
      # On a `newest-java` cell, the family test once more on that Java, and on a `client` cell
      # with a real client joining: Spigot 1.8.8 runs the cell on Java 8, but owners start it on
      # 21 too, where plugins sharing the stdlib broke each other's classes as they started
      # together (decisions/2026-11-28-old-bukkit-libraries-in-the-servers-class-loader.md).
      - id: newest-java
        if: matrix.cell.family && matrix.cell.newest-java != 0
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.cell.newest-java }}
      - name: family test on the newest Java
        if: matrix.cell.family && matrix.cell.newest-java != 0
        env:
          JAR: ${{ steps.jar.outputs.jar }}
          JAVA: ${{ steps.newest-java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          if [[ -n $JAR ]]; then target=("$JAR"); else target=("$SERVER" "$VERSION"); fi
          # Spigot 1.8.8's Netty can't use Linux's native transport past Java 15 (it resets a
          # client's connection), so this boot turns it off, as owners on a newer Java do.
          args=(--property use-native-transport=false)
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks core/core-testing/sample/bukkit/client-checks.txt)
          core/core-testing/sample/bukkit/boot.sh "${target[@]}" --java "$JAVA" --jvm -Dxena.debug.paste=false "${args[@]}" \
            --checks core/core-testing/twin/family-checks.txt --checks xutilities/bukkit/boot-checks.txt --checks zchat/bukkit/boot-checks.txt \
            --checks xteleport/bukkit/boot-checks.txt --checks xbans/bukkit/boot-checks.txt --checks xvanish/bukkit/boot-checks.txt --checks xmarket/bukkit/boot-checks.txt \
            --checks xvote/bukkit/boot-checks.txt --checks xbackup/bukkit/boot-checks.txt \
            core/core-testing/twin/bukkit/build/r8/XTwin.jar xutilities/bukkit/build/r8/xUtilities.jar zchat/bukkit/build/r8/zChat.jar \
            xteleport/bukkit/build/r8/xTeleport.jar xbans/bukkit/build/r8/xBans.jar xvanish/bukkit/build/r8/xVanish.jar xmarket/bukkit/build/r8/xMarket.jar \
            xvote/bukkit/build/r8/xVote.jar xbackup/bukkit/build/r8/xBackup.jar
      # The runtime budgets are the `budgets` job's, on a server of their own: a boot test's
      # server is shared with its checks, which would skew the numbers.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: boot-logs-${{ matrix.cell.id }}
          path: build/boot/*/console.log
          if-no-files-found: ignore

  # The proxies (scripts/boot-proxy.sh): xSample's proxy side alone, its console commands and
  # platform checks, and its startup against the first-plugin budget (gradle/perf-budgets.txt's
  # startup-first-ms, median of three boots); then, on a cell with a backend, the pair test:
  # xSample on that backend behind the proxy, and a real client joining through it, running
  # the proxy's commands in German and English and sending a forged message on xena:xsample,
  # which the proxy must drop, while the backend's hello and the proxy's welcome cross
  # xena:xsample signed with the network's secret (core/core-testing/sample/<side>/pair-checks.txt).
  proxy:
    needs: [changes, build-proxy]
    if: needs.changes.outputs.proxy != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
    continue-on-error: ${{ matrix.cell.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.changes.outputs.proxy) }}
    name: boot (${{ matrix.cell.name }})
    env:
      PROXY: ${{ matrix.cell.proxy }}
      SIDE: ${{ matrix.cell.side }}
      BACKEND: ${{ matrix.cell.backend }}
      BACKEND_VERSION: ${{ matrix.cell.backend-version }}
    steps:
      - uses: actions/checkout@v7
      # upload-artifact keeps files relative to the folder they share, which for these jars
      # (the sample's, zChat's and xBans') is the repo's root, so they go back there. The check after
      # names a jar that isn't where the boots look, should that folder ever change.
      - uses: actions/download-artifact@v8
        with:
          name: proxy-jars
          path: .
      - name: Check the proxy jars are in place
        run: |
          for jar in core/core-testing/sample/velocity/build/r8/XSample-Velocity.jar \
                     core/core-testing/sample/bungee/build/r8/XSample-Bungee.jar \
                     core/core-testing/sample/bukkit/build/r8/XSample.jar \
                     zchat/velocity/build/r8/zChat-Velocity.jar zchat/bungee/build/r8/zChat-Bungee.jar \
                     zchat/bukkit/build/r8/zChat.jar xbans/velocity/build/r8/xBans-Velocity.jar \
                     xbans/bungee/build/r8/xBans-Bungee.jar xbans/bukkit/build/r8/xBans.jar \
                     xvanish/bukkit/build/r8/xVanish.jar \
                     xvote/velocity/build/r8/xVote-Velocity.jar xvote/bungee/build/r8/xVote-Bungee.jar \
                     xvote/bukkit/build/r8/xVote.jar xstats/velocity/build/r8/xStats-Velocity.jar \
                     xstats/bukkit/build/r8/xStats.jar; do
            [[ -f $jar ]] || { echo "::error::$jar is missing: the proxy-jars artifact landed somewhere else"; find . -name '*.jar' -path '*build/r8*' | head -20; exit 1; }
          done
      # What will boot, for the cache key: the proxy's version and build (and the Java it needs),
      # and the backend's.
      - id: server
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.cell.version }}
        run: scripts/server-jar.sh --resolve "$PROXY" ${VERSION:+"$VERSION"} | tee -a "$GITHUB_OUTPUT"
      - id: backend
        if: matrix.cell.backend != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/server-jar.sh --resolve "$BACKEND" "$BACKEND_VERSION" | tee -a "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v6
        with:
          path: .cache/servers
          key: servers-${{ matrix.cell.id }}-${{ steps.server.outputs.build }}-${{ steps.backend.outputs.build }}
          restore-keys: servers-${{ matrix.cell.id }}-
      # BungeeCord's and Waterfall's downloads of the plugins' libraries: (bungee.yml), one repository
      # every boot shares (scripts/boot-proxy.sh): a proxy downloading from Maven Central on every
      # boot sometimes stalled there past the start's 120s (#248). Keyed on the versions they name.
      - if: matrix.cell.proxy != 'velocity'
        uses: actions/cache@v6
        with:
          path: .cache/bungee-libraries
          key: bungee-libraries-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: bungee-libraries-
      # BuildTools' Java, only when a Spigot backend isn't cached.
      - id: buildtools
        if: matrix.cell.backend == 'spigot' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.cell.buildtools }}
      - id: backend-jar
        if: matrix.cell.backend == 'spigot'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDTOOLS_JAVA: ${{ steps.buildtools.outputs.path }}
        run: scripts/server-jar.sh "$BACKEND" "$BACKEND_VERSION" | tee -a "$GITHUB_OUTPUT"
      - id: backend-java
        if: matrix.cell.backend != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.backend.outputs.java }}
      - id: java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.server.outputs.java }}
      - if: matrix.cell.backend != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: matrix.cell.backend != ''
        uses: actions/cache@v6
        with:
          path: .cache/budget-bots
          key: client-bots-${{ hashFiles('scripts/budgets/bots/package-lock.json') }}
      - name: boot xSample
        env:
          JAVA: ${{ steps.java.outputs.path }}
          VERSION: ${{ steps.server.outputs.version }}
        run: |
          jar=core/core-testing/sample/$SIDE/build/r8/XSample-${SIDE^}.jar
          version=()
          [[ $VERSION == latest ]] || version=(--version "$VERSION")
          budget=$(sed -n 's/^startup-first-ms //p' gradle/perf-budgets.txt)
          scripts/boot-proxy.sh --proxy "$PROXY" "${version[@]}" --java "$JAVA" \
            --checks "core/core-testing/sample/$SIDE/boot-checks.txt" --startup-budget "$budget" "$jar"
      - name: pair test
        if: matrix.cell.backend != ''
        env:
          JAVA: ${{ steps.java.outputs.path }}
          VERSION: ${{ steps.server.outputs.version }}
          BACKEND_JAVA: ${{ steps.backend-java.outputs.path }}
          BACKEND_JAR: ${{ steps.backend-jar.outputs.jar }}
        run: |
          jar=core/core-testing/sample/$SIDE/build/r8/XSample-${SIDE^}.jar
          version=()
          [[ $VERSION == latest ]] || version=(--version "$VERSION")
          backend=(--backend "${BACKEND_JAR:-$BACKEND}" --backend-version "$BACKEND_VERSION")
          scripts/boot-proxy.sh --proxy "$PROXY" "${version[@]}" --java "$JAVA" "${backend[@]}" --backend-java "$BACKEND_JAVA" \
            --backend-plugin core/core-testing/sample/bukkit/build/r8/XSample.jar --grant 'Joiner=xsample.*,xsample.admin' \
            --checks "core/core-testing/sample/$SIDE/pair-checks.txt" "$jar"
      # zChat's relay alone, with its startup against the budget; then, where the cell has a
      # backend, the network test: two servers with zChat behind the proxy, a real client on
      # each, and chat, /msg and /reply crossing between them (zchat/<side>/network-checks.txt).
      - name: boot zChat
        env:
          JAVA: ${{ steps.java.outputs.path }}
          VERSION: ${{ steps.server.outputs.version }}
        run: |
          version=()
          [[ $VERSION == latest ]] || version=(--version "$VERSION")
          budget=$(sed -n 's/^startup-first-ms //p' gradle/perf-budgets.txt)
          scripts/boot-proxy.sh --proxy "$PROXY" "${version[@]}" --java "$JAVA" --jvm -Dxena.debug.paste=false \
            --checks "zchat/$SIDE/boot-checks.txt" --startup-budget "$budget" "zchat/$SIDE/build/r8/zChat-${SIDE^}.jar"
      - name: zChat network test
        if: matrix.cell.backend != ''
        env:
          JAVA: ${{ steps.java.outputs.path }}
          VERSION: ${{ steps.server.outputs.version }}
          BACKEND_JAVA: ${{ steps.backend-java.outputs.path }}
          BACKEND_JAR: ${{ steps.backend-jar.outputs.jar }}
        run: |
          version=()
          [[ $VERSION == latest ]] || version=(--version "$VERSION")
          backend=(--backend "${BACKEND_JAR:-$BACKEND}" --backend-version "$BACKEND_VERSION")
          scripts/boot-proxy.sh --proxy "$PROXY" "${version[@]}" --java "$JAVA" "${backend[@]}" --backend-java "$BACKEND_JAVA" \
            --backend-plugin zchat/bukkit/build/r8/zChat.jar --two-backends --backend-seed zchat/velocity/network-seed \
            --grant Friend=bungeecord.command.server --jvm -Dxena.debug.paste=false \
            --checks "zchat/$SIDE/network-checks.txt" "zchat/$SIDE/build/r8/zChat-${SIDE^}.jar"
      # xBans on the proxy alone, with its startup against the budget; then, where the cell has a
      # backend, the network test: two servers with xBans behind the proxy, all on one MariaDB (a
      # container network.sh starts), a real client on each: a mute made on lobby stopping chat on
      # game, a ban made on lobby taking the player off the network and the proxy turning them away
      # at its door, and an unban letting them back (xbans/<side>/network-checks.txt).
      - name: boot xBans
        env:
          JAVA: ${{ steps.java.outputs.path }}
          VERSION: ${{ steps.server.outputs.version }}
        run: |
          version=()
          [[ $VERSION == latest ]] || version=(--version "$VERSION")
          budget=$(sed -n 's/^startup-first-ms //p' gradle/perf-budgets.txt)
          scripts/boot-proxy.sh --proxy "$PROXY" "${version[@]}" --java "$JAVA" --jvm -Dxena.debug.paste=false \
            --checks "xbans/$SIDE/boot-checks.txt" --startup-budget "$budget" "xbans/$SIDE/build/r8/xBans-${SIDE^}.jar"
      - name: xBans network test
        if: matrix.cell.backend != ''
        env:
          JAVA: ${{ steps.java.outputs.path }}
          VERSION: ${{ steps.server.outputs.version }}
          BACKEND_JAVA: ${{ steps.backend-java.outputs.path }}
          BACKEND_JAR: ${{ steps.backend-jar.outputs.jar }}
        run: |
          version=()
          [[ $VERSION == latest ]] || version=(--version "$VERSION")
          xbans/velocity/network.sh "$PROXY" "${version[@]}" --java "$JAVA" --backend "${BACKEND_JAR:-$BACKEND}" \
            --backend-version "$BACKEND_VERSION" --backend-java "$BACKEND_JAVA"
      # xVanish has no proxy side: its network test is two servers with xVanish behind the proxy, on
      # one MariaDB (a container network.sh starts), and real clients: a player vanished on lobby
      # named by /vanish list on game, switching to game and staying hidden from a player there
      # (xvanish/bukkit/network.sh, network-checks.txt).
      - name: xVanish network test
        if: matrix.cell.backend != ''
        env:
          JAVA: ${{ steps.java.outputs.path }}
          VERSION: ${{ steps.server.outputs.version }}
          BACKEND_JAVA: ${{ steps.backend-java.outputs.path }}
          BACKEND_JAR: ${{ steps.backend-jar.outputs.jar }}
        run: |
          version=()
          [[ $VERSION == latest ]] || version=(--version "$VERSION")
          xvanish/bukkit/network.sh "$PROXY" "${version[@]}" --java "$JAVA" --backend "${BACKEND_JAR:-$BACKEND}" \
            --backend-version "$BACKEND_VERSION" --backend-java "$BACKEND_JAVA"
      # xVote on the proxy alone, with its startup against the budget: its receiver, a test vote
      # through it, its admin subcommands. Then, where the cell has a backend, the network test: two
      # servers with xVote behind the proxy, all on one MariaDB (a container network.sh starts), and
      # real Votifier v2 votes sent to the proxy, each paid on the server its player is on, or the
      # first one they join (xvote/<side>/network-checks.txt).
      - name: boot xVote
        env:
          JAVA: ${{ steps.java.outputs.path }}
          VERSION: ${{ steps.server.outputs.version }}
        run: |
          version=()
          [[ $VERSION == latest ]] || version=(--version "$VERSION")
          budget=$(sed -n 's/^startup-first-ms //p' gradle/perf-budgets.txt)
          scripts/boot-proxy.sh --proxy "$PROXY" "${version[@]}" --java "$JAVA" --jvm -Dxena.debug.paste=false \
            --checks "xvote/$SIDE/boot-checks.txt" --startup-budget "$budget" "xvote/$SIDE/build/r8/xVote-${SIDE^}.jar"
      - name: xVote network test
        if: matrix.cell.backend != ''
        env:
          JAVA: ${{ steps.java.outputs.path }}
          VERSION: ${{ steps.server.outputs.version }}
          BACKEND_JAVA: ${{ steps.backend-java.outputs.path }}
          BACKEND_JAR: ${{ steps.backend-jar.outputs.jar }}
        run: |
          version=()
          [[ $VERSION == latest ]] || version=(--version "$VERSION")
          xvote/velocity/network.sh "$PROXY" "${version[@]}" --java "$JAVA" --backend "${BACKEND_JAR:-$BACKEND}" \
            --backend-version "$BACKEND_VERSION" --backend-java "$BACKEND_JAVA"
      # xStats on Velocity alone (it has no BungeeCord side), with its startup against the budget: the
      # network's view, read-only, and its admin subcommands. Then, where the cell has a backend, the
      # network test: two servers with xStats behind the proxy, all on one MariaDB (a container
      # network.sh starts), a real client jumping on lobby, and the proxy's /networkleaderboard with
      # them on it once lobby saves (xstats/velocity/network-checks.txt).
      - name: boot xStats
        if: matrix.cell.proxy == 'velocity'
        env:
          JAVA: ${{ steps.java.outputs.path }}
          VERSION: ${{ steps.server.outputs.version }}
        run: |
          version=()
          [[ $VERSION == latest ]] || version=(--version "$VERSION")
          budget=$(sed -n 's/^startup-first-ms //p' gradle/perf-budgets.txt)
          scripts/boot-proxy.sh --proxy velocity "${version[@]}" --java "$JAVA" --jvm -Dxena.debug.paste=false \
            --checks xstats/velocity/boot-checks.txt --startup-budget "$budget" xstats/velocity/build/r8/xStats-Velocity.jar
      - name: xStats network test
        if: matrix.cell.proxy == 'velocity' && matrix.cell.backend != ''
        env:
          JAVA: ${{ steps.java.outputs.path }}
          VERSION: ${{ steps.server.outputs.version }}
          BACKEND_JAVA: ${{ steps.backend-java.outputs.path }}
          BACKEND_JAR: ${{ steps.backend-jar.outputs.jar }}
        run: |
          version=()
          [[ $VERSION == latest ]] || version=(--version "$VERSION")
          xstats/velocity/network.sh "${version[@]}" --java "$JAVA" --backend "${BACKEND_JAR:-$BACKEND}" \
            --backend-version "$BACKEND_VERSION" --backend-java "$BACKEND_JAVA"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: boot-logs-${{ matrix.cell.id }}
          path: |
            build/boot/*/*/console.log
            build/boot/*/client.log
          if-no-files-found: ignore

  fabric:
    needs: [changes, build-fabric]
    if: needs.changes.outputs.fabric != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    continue-on-error: ${{ matrix.cell.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.changes.outputs.fabric) }}
    name: boot (${{ matrix.cell.name }})
    env:
      LOADER: ${{ matrix.cell.loader }}
      VERSION: ${{ matrix.cell.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fabric-jars
          path: core/platform-fabric/build/libs
      # The launcher, Fabric API, fabric-language-kotlin, Mojang's jar and the libraries:
      # keyed on the versions platform-fabric builds against.
      - uses: actions/cache@v6
        with:
          path: .cache/fabric
          key: fabric-${{ matrix.cell.loader }}-${{ matrix.cell.version }}-${{ hashFiles('core/platform-fabric/stonecutter.properties.toml') }}
          restore-keys: fabric-${{ matrix.cell.loader }}-${{ matrix.cell.version }}-
      - id: java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.cell.java }}
      # The real clients' Node.js and mineflayer packages, which boot-fabric.sh installs into .cache.
      - if: matrix.cell.client
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: matrix.cell.client
        uses: actions/cache@v6
        with:
          path: .cache/budget-bots
          key: client-bots-${{ hashFiles('scripts/budgets/bots/package-lock.json') }}
      # Each plugin alone, its console checks and a clean stop; on a `client` cell also real
      # clients (scripts/budgets/bots/client.js, as on Bukkit, with --fabric), Joiner an operator
      # through the seeded ops.json, with the plugins each scenario needs beside it. On 1.20.1,
      # where Minecraft keeps no client language, they read English (boot-fabric.sh's header).
      - name: boot xSample
        env:
          JAVA: ${{ steps.java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          args=()
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks core/platform-fabric/sandbox/client-checks.txt)
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks core/platform-fabric/sandbox/boot-checks.txt "${args[@]}" \
            core/platform-fabric/build/libs/xsample-fabric-*+"$VERSION".jar
      - name: boot xUtilities
        env:
          JAVA: ${{ steps.java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          libs=core/platform-fabric/build/libs
          args=()
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xutilities/fabric/client-checks.txt)
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks xutilities/fabric/boot-checks.txt "${args[@]}" \
            "$libs"/xutilities-fabric-*+"$VERSION".jar
      - name: boot zChat
        env:
          JAVA: ${{ steps.java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          libs=core/platform-fabric/build/libs
          args=()
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks zchat/fabric/client-checks.txt)
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks zchat/fabric/boot-checks.txt "${args[@]}" \
            "$libs"/zchat-fabric-*+"$VERSION".jar
      - name: boot xMoney
        env:
          JAVA: ${{ steps.java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          libs=core/platform-fabric/build/libs
          args=()
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --seed xmoney/fabric/zchat-seed --checks xmoney/fabric/zchat-checks.txt
            --checks xmoney/fabric/zchat-client-checks.txt "$libs"/zchat-fabric-*+"$VERSION".jar)
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks xmoney/fabric/boot-checks.txt "${args[@]}" \
            "$libs"/xmoney-fabric-*+"$VERSION".jar
      - name: boot xTeleport
        env:
          JAVA: ${{ steps.java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          libs=core/platform-fabric/build/libs
          args=()
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --seed xteleport/fabric/xmoney-seed
            --checks xteleport/fabric/xmoney-client-checks.txt "$libs"/xmoney-fabric-*+"$VERSION".jar)
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks xteleport/fabric/boot-checks.txt "${args[@]}" \
            "$libs"/xteleport-fabric-*+"$VERSION".jar
      - name: boot xBans
        env:
          JAVA: ${{ steps.java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          libs=core/platform-fabric/build/libs
          args=()
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xbans/fabric/zchat-client-checks.txt "$libs"/zchat-fabric-*+"$VERSION".jar)
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks xbans/fabric/boot-checks.txt "${args[@]}" \
            "$libs"/xbans-fabric-*+"$VERSION".jar
      # xBackup beside xMoney and xBans, whose databases their own writers copy for each backup
      # (xbackup/fabric/family-checks.txt): backups with saving off and the worlds flushed, a changed
      # chunk read after the flush, a full check, a staged restore called off, a reload and debug;
      # on a `client` cell also a real client staging a restore (xbackup/fabric/client-checks.txt).
      - name: boot xBackup
        env:
          JAVA: ${{ steps.java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          libs=core/platform-fabric/build/libs
          args=()
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xbackup/fabric/client-checks.txt)
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks xbackup/fabric/boot-checks.txt --checks xbackup/fabric/family-checks.txt "${args[@]}" \
            "$libs"/xbackup-fabric-*+"$VERSION".jar "$libs"/xmoney-fabric-*+"$VERSION".jar "$libs"/xbans-fabric-*+"$VERSION".jar
      - name: boot xVanish
        env:
          JAVA: ${{ steps.java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          libs=core/platform-fabric/build/libs
          args=()
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xvanish/fabric/client-checks.txt
            "$libs"/zchat-fabric-*+"$VERSION".jar "$libs"/xteleport-fabric-*+"$VERSION".jar)
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks xvanish/fabric/boot-checks.txt "${args[@]}" \
            "$libs"/xvanish-fabric-*+"$VERSION".jar
      - name: boot xMarket
        env:
          JAVA: ${{ steps.java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          libs=core/platform-fabric/build/libs
          args=()
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xmarket/fabric/xmoney-client-checks.txt "$libs"/xmoney-fabric-*+"$VERSION".jar)
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks xmarket/fabric/boot-checks.txt "${args[@]}" \
            "$libs"/xmarket-fabric-*+"$VERSION".jar
      # xVote alone: test votes through its receiver, the lists, the imports' refusals, a reload and
      # debug; on a `client` cell beside xMoney, with two real clients and real Votifier v2 votes: one
      # for Friend before Friend has ever joined, paid as Friend joins, one for Joiner, paid at once
      # with 25 through xMoney's API, and /vote in German (xvote/fabric/xmoney-client-checks.txt).
      - name: boot xVote
        env:
          JAVA: ${{ steps.java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          libs=core/platform-fabric/build/libs
          args=()
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --seed xvote/fabric/xmoney-seed
            --checks xvote/fabric/xmoney-client-checks.txt "$libs"/xmoney-fabric-*+"$VERSION".jar)
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks xvote/fabric/boot-checks.txt "${args[@]}" \
            "$libs"/xvote-fabric-*+"$VERSION".jar
      # xStats alone: every console command, a save, the website's self-test and export, the import
      # (which waits for the world Fabric makes after the mods), a reload and debug (xstats/fabric/boot-checks.txt).
      - name: boot xStats
        env:
          JAVA: ${{ steps.java.outputs.path }}
        run: |
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks xstats/fabric/boot-checks.txt core/platform-fabric/build/libs/xstats-fabric-*+"$VERSION".jar
      - name: boot xRewind
        env:
          JAVA: ${{ steps.java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          libs=core/platform-fabric/build/libs
          args=()
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xrewind/fabric/client-checks.txt)
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks xrewind/fabric/boot-checks.txt "${args[@]}" \
            "$libs"/xrewind-fabric-*+"$VERSION".jar
      - name: boot xLimits
        env:
          JAVA: ${{ steps.java.outputs.path }}
        run: |
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks xlimits/fabric/boot-checks.txt \
            core/platform-fabric/build/libs/xlimits-fabric-*+"$VERSION".jar
      # xMoney beside zChat: zChat's formats get xMoney's <balance> through zChat's placeholder seam.
      - name: xMoney beside zChat
        if: matrix.cell.family
        env:
          JAVA: ${{ steps.java.outputs.path }}
        run: |
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks xmoney/fabric/boot-checks.txt --checks xmoney/fabric/zchat-checks.txt \
            core/platform-fabric/build/libs/xmoney-fabric-*+"$VERSION".jar core/platform-fabric/build/libs/zchat-fabric-*+"$VERSION".jar
      - name: family test
        if: matrix.cell.family
        env:
          JAVA: ${{ steps.java.outputs.path }}
        run: |
          scripts/boot-fabric.sh --loader "$LOADER" --version "$VERSION" --java "$JAVA" \
            --checks core/platform-fabric/sandbox/boot-checks.txt --checks core/core-testing/twin/family-checks.txt \
            --checks xutilities/fabric/boot-checks.txt --checks zchat/fabric/boot-checks.txt --checks xteleport/fabric/boot-checks.txt \
            --checks xvanish/fabric/boot-checks.txt --checks xmarket/fabric/boot-checks.txt --checks xrewind/fabric/boot-checks.txt \
            core/platform-fabric/build/libs/xsample-fabric-*+"$VERSION".jar core/platform-fabric/build/libs/xtwin-fabric-*+"$VERSION".jar \
            core/platform-fabric/build/libs/xutilities-fabric-*+"$VERSION".jar core/platform-fabric/build/libs/zchat-fabric-*+"$VERSION".jar \
            core/platform-fabric/build/libs/xteleport-fabric-*+"$VERSION".jar core/platform-fabric/build/libs/xvanish-fabric-*+"$VERSION".jar \
            core/platform-fabric/build/libs/xmarket-fabric-*+"$VERSION".jar core/platform-fabric/build/libs/xrewind-fabric-*+"$VERSION".jar
      # Fabric's runtime budgets aren't measured yet; its jars' sizes are checked in
      # build-fabric (gradle/jar-budgets.txt).
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: boot-logs-${{ matrix.cell.id }}
          path: |
            build/boot/*/console.log
            build/boot/*/client.log
          if-no-files-found: ignore

  neoforge:
    needs: [changes, build-neoforge]
    if: needs.changes.outputs.neoforge != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    continue-on-error: ${{ matrix.cell.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.changes.outputs.neoforge) }}
    name: boot (${{ matrix.cell.name }})
    env:
      VERSION: ${{ matrix.cell.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: neoforge-jars
          path: core/platform-neoforge/build/libs
      # NeoForge's installer and server, Kotlin for Forge, Mojang's jar and the libraries: keyed on
      # the versions platform-neoforge builds against.
      - uses: actions/cache@v6
        with:
          path: .cache/neoforge
          key: neoforge-${{ matrix.cell.version }}-${{ hashFiles('core/platform-neoforge/stonecutter.properties.toml') }}
          restore-keys: neoforge-${{ matrix.cell.version }}-
      - id: java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.cell.java }}
      - if: matrix.cell.client
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: matrix.cell.client
        uses: actions/cache@v6
        with:
          path: .cache/budget-bots
          key: client-bots-${{ hashFiles('scripts/budgets/bots/package-lock.json') }}
      # Each mod alone, its console checks and a clean stop; on a `client` cell also a real
      # vanilla client (scripts/budgets/bots/client.js with --fabric, the vanilla-server side),
      # Joiner an operator through the seeded ops.json: players install nothing.
      - name: boot xSample
        env:
          JAVA: ${{ steps.java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          args=()
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks core/platform-neoforge/sandbox/client-checks.txt)
          scripts/boot-neoforge.sh --version "$VERSION" --java "$JAVA" \
            --checks core/platform-neoforge/sandbox/boot-checks.txt "${args[@]}" \
            core/platform-neoforge/build/libs/xsample-neoforge-*+"$VERSION".jar
      - name: boot xUtilities
        env:
          JAVA: ${{ steps.java.outputs.path }}
          CLIENT: ${{ matrix.cell.client }}
        run: |
          libs=core/platform-neoforge/build/libs
          args=()
          [[ $CLIENT != true ]] || args+=(--seed scripts/boot-seeds/client --checks xutilities/neoforge/client-checks.txt)
          scripts/boot-neoforge.sh --version "$VERSION" --java "$JAVA" \
            --checks xutilities/neoforge/boot-checks.txt "${args[@]}" \
            "$libs"/xutilities-neoforge-*+"$VERSION".jar
      - name: family test
        if: matrix.cell.family
        env:
          JAVA: ${{ steps.java.outputs.path }}
        run: |
          libs=core/platform-neoforge/build/libs
          scripts/boot-neoforge.sh --version "$VERSION" --java "$JAVA" \
            --checks core/platform-neoforge/sandbox/boot-checks.txt --checks core/core-testing/twin/family-checks.txt \
            --checks xutilities/neoforge/boot-checks.txt \
            "$libs"/xsample-neoforge-*+"$VERSION".jar "$libs"/xtwin-neoforge-*+"$VERSION".jar "$libs"/xutilities-neoforge-*+"$VERSION".jar
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: boot-logs-${{ matrix.cell.id }}
          path: |
            build/boot/*/console.log
            build/boot/*/client.log
          if-no-files-found: ignore

  # The runtime budgets (ROADMAP.md, "Fast, robust, light"; gradle/perf-budgets.txt) on Paper,
  # with xSample's R8 jar: scripts/budgets/check.sh boots it 4 times for startup, then measures
  # heap, metaspace and an idle profile with async-profiler. Over any budget fails the job,
  # startup's included: 60 ms on an M1 Pro on Paper 1.21.11, 39 ms on 26.3, with Paper handed
  # the libraries by the core's loader and the startup classes loaded ahead (DECISIONS.md,
  # "Startup under budget").
  # Per pull request on the newest Paper without players, a few minutes beside the boots;
  # nightly and by hand also the BotMark load, 10 mineflayer bots for a minute, on Paper
  # 1.21.11, the newest Minecraft mineflayer speaks and the version M0 measured.
  budgets:
    needs: [changes, build-bukkit]
    if: needs.changes.outputs.bukkit != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # One plugin a job, side by side: one job booting them all in turn outgrew its 30 minutes.
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - {id: newest, name: xSample, jar: core/core-testing/sample/bukkit/build/r8/XSample.jar}
          - {id: xutilities, name: xUtilities, jar: xutilities/bukkit/build/r8/xUtilities.jar}
          - {id: zchat, name: zChat, jar: zchat/bukkit/build/r8/zChat.jar}
          - {id: xmoney, name: xMoney, jar: xmoney/bukkit/build/r8/xMoney.jar}
          - {id: xteleport, name: xTeleport, jar: xteleport/bukkit/build/r8/xTeleport.jar}
          - {id: xbans, name: xBans, jar: xbans/bukkit/build/r8/xBans.jar}
          - {id: xbackup, name: xBackup, jar: xbackup/bukkit/build/r8/xBackup.jar}
          - {id: xvanish, name: xVanish, jar: xvanish/bukkit/build/r8/xVanish.jar}
          - {id: xmarket, name: xMarket, jar: xmarket/bukkit/build/r8/xMarket.jar}
          - {id: xvote, name: xVote, jar: xvote/bukkit/build/r8/xVote.jar}
          - {id: xrewind, name: xRewind, jar: xrewind/bukkit/build/r8/xRewind.jar}
          - {id: xlimits, name: xLimits, jar: xlimits/bukkit/build/r8/xLimits.jar}
          # With its limbo given a folder it won't touch, so the heap is xLimbo's and not its world's (the seed's config says why).
          - {id: xlimbo, name: xLimbo, jar: xlimbo/bukkit/build/r8/xLimbo.jar, seed: xlimbo/bukkit/budgets-seed}
          - {id: xplots, name: xPlots, jar: xplots/bukkit/build/r8/xPlots.jar}
          - {id: xstats, name: xStats, jar: xstats/bukkit/build/r8/xStats.jar}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bukkit-jars
          path: .
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Paper's jars and libraries, async-profiler and the bots' packages.
      - uses: actions/cache@v6
        with:
          path: |
            .cache/servers
            .cache/async-profiler
            .cache/budget-bots
          key: budgets-${{ hashFiles('gradle.properties', 'scripts/budgets/check.sh', 'scripts/budgets/bots/package-lock.json') }}
          restore-keys: budgets-
      # async-profiler's CPU samples need perf events, which the runner's kernel keeps from
      # unprivileged processes.
      - run: sudo sysctl kernel.perf_event_paranoid=1
      # Every rewritten plugin and xSample, measured the same way, against the same budgets
      # (startup and metaspace failing too since decisions/2026-11-25-a-lighter-core.md).
      - name: runtime budgets, ${{ matrix.plugin.name }} (newest Paper)
        env:
          ID: ${{ matrix.plugin.id }}
          JAR: ${{ matrix.plugin.jar }}
          SEED: ${{ matrix.plugin.seed }}
        run: |
          newest=$(sed -n 's/^xena\.ciNewestMinecraft=//p' gradle.properties)
          seed=()
          [[ -z $SEED ]] || seed=(--seed "$SEED")
          scripts/budgets/check.sh --version "$newest" --java "$JAVA_HOME_25_X64" --bots 0 --idle 30 --settle 15 \
            "${seed[@]}" --out "build/budgets/$ID" "$JAR"
      # Its startup is reported, not budgeted: Paper 1.21.11 loads a plugin about 4 times
      # slower than 26.3 on these 2-core runners (its JIT threads and loader, not our code: the
      # server thread spends 6-7 ms of CPU in our enable), and startup is budgeted, failing, on
      # the newest Paper above. The load, heap, metaspace and idle budgets fail here as before.
      - name: BotMark load (Paper 1.21.11, 10 bots)
        if: github.event_name != 'pull_request' && matrix.plugin.id == 'newest'
        run: |
          scripts/budgets/check.sh --version 1.21.11 --java "$JAVA_HOME_21_X64" --bots 10 \
            --report-only startup-first-ms,startup-ms \
            --commands "xsample,coins,pay {other} 1" \
            --out build/budgets/botmark \
            core/core-testing/sample/bukkit/build/r8/XSample.jar
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: budgets-${{ matrix.plugin.id }}
          path: |
            build/budgets/*/report.md
            build/budgets/*/results.json
            build/budgets/*/*.log
          if-no-files-found: ignore

  # The core's hot paths under JMH (core/core-benchmarks), against its budgets.txt: bytes
  # allocated per call held close, times at five times an M1 Pro's. About three minutes.
  benchmarks:
    needs: changes
    if: needs.changes.outputs.bukkit != '[]' || needs.changes.outputs.fabric != '[]' || needs.changes.outputs.proxy != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - run: ./gradlew :core:core-benchmarks:checkBenchmarks
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: |
            core/core-benchmarks/build/reports/benchmarks/quick/results.json
            core/core-benchmarks/build/reports/benchmarks/budgets.md
          if-no-files-found: ignore

  # The one check to require: passes when every job above passed, was skipped because nothing
  # it covers changed, or failed in a cell allowed to fail; fails when any other failed.
  boot-ok:
    needs: [changes, build-bukkit, build-fabric, build-neoforge, build-proxy, bukkit, fabric, neoforge, proxy, budgets, benchmarks]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "ok"
