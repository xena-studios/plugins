name: CodeQL

# Code scanning: the plugins' Java and the rewrite's Kotlin (both traced through a
# real Gradle build, for the most accurate dataflow), the workflows (they hold the
# Modrinth, Maven Central and Cloudflare secrets), and the TypeScript and JavaScript:
# the docs, scripts/ and xStats' website. Findings show on pull requests and in the Security tab.
# Dependencies are Renovate's: it opens a fix PR as soon as one has a known
# vulnerability.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, for new queries against unchanged code.
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it replaces.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    # A hung build fails the job instead of holding a runner for six hours.
    timeout-minutes: 30
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          # The default configs the tests write for the docs, and xMoney 1.x's shipped
          # configs its migration tests read: sample YAML, whose blank MySQL password is
          # the setting owners fill in, not a credential.
          config: |
            paths-ignore:
              - docs/src/generated
              - xmoney/common/src/jvmTest/resources
      # CodeQL reads the code as javac and kotlinc compile it, so every source file has
      # to really compile here: no build cache, no daemon, every task rerun, and Kotlin's
      # compiler inside the traced build rather than in its own daemon. The Kotlin tasks
      # are the JVM ones: compileKotlin (Kotlin/JVM modules) and compileKotlinJvm (the
      # multiplatform ones); wasmWasi has no JVM code for CodeQL to read.
      - if: matrix.build-mode == 'manual'
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks
          -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false
          compileJava compileTestJava compileKotlin compileTestKotlin compileKotlinJvm compileTestKotlinJvm
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
