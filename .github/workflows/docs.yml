name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  # Redeploy main by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: docs
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Not sensitive (it's in every dashboard URL), so a variable, not a secret.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      # Fails on any broken internal link (starlight-links-validator).
      - run: npm run build
      - run: npx wrangler@4 deploy --dry-run
      # Main deploys (on push or by hand); pull requests only check the build.
      - name: Deploy to Cloudflare
        # Skipped until the repo has Cloudflare secrets, and on forks.
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler@4 deploy
