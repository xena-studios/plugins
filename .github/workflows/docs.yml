name: Docs

# Pull requests always run, so the `docs-ok` check main requires always
# reports; `changes` skips the build when the docs didn't change.
on:
  push:
    branches: [main]
    # The docs, and what the plugin catalog reads: each plugin's build file (its version and
    # Folia support), api/ folder and changelog.
    paths: ["docs/**", ".github/workflows/docs.yml", "*/build.gradle.kts", "*/api/build.gradle.kts", "*/CHANGELOG.md"]
  pull_request:
  # Redeploy main by hand from the Actions tab. A release does too (release.yml), so its
  # download page lists it at once.
  workflow_dispatch:
  # Daily, so the download pages pick up anything published on Modrinth by hand.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

# One run per branch at a time, so two quick merges can't deploy out of order; a
# new push to a pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    outputs:
      docs: ${{ steps.check.outputs.docs }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ $GITHUB_EVENT_NAME != pull_request ]]; then echo "docs=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The changed files, from the files API, paged: `gh pr diff` refuses pull requests
          # over 300 files. If the call fails, everything is checked, never skipped.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') \
            || { echo "docs=true" >> "$GITHUB_OUTPUT"; exit 0; }
          docs=false
          while read -r file; do
            # The docs, the files scripts/catalog.ts reads (each plugin's build file and api/),
            # and the ones it writes outside docs/.
            case $file in
              docs/* | .github/workflows/docs.yml) docs=true ;;
              */build.gradle.kts | */api/build.gradle.kts | */CHANGELOG.md | */modrinth.md) docs=true ;;
              README.md | .github/labeler.yml | .github/workflows/labels.yml | .github/ISSUE_TEMPLATE/bug_report.yml) docs=true ;;
            esac
          done <<< "$files"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      # The version comes from packageManager in docs/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Fails on a type error (astro check) or any broken internal link
      # (starlight-links-validator).
      - run: pnpm build
      - run: pnpm exec wrangler deploy --dry-run

  # Main only (on push or by hand), once the build passes. The Cloudflare token
  # lives in the docs environment, which GitHub opens to main alone, and only the
  # deploy step sees it: never pnpm install or the build.
  deploy:
    needs: docs
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'xena-studios/plugins' }}
    runs-on: ubuntu-26.04
    environment:
      name: docs
      url: https://docs.xenastudios.co
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit, so each page's "Last updated" is when it last changed, not the deploy.
          fetch-depth: 0
      # The version comes from packageManager in docs/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not sensitive (it's in every dashboard URL), so a variable, not a secret.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # The one check main requires: passes when the build passed or was skipped
  # because the docs didn't change.
  docs-ok:
    needs: [changes, docs, deploy]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "ok"
