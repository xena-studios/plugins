name: Docs

# Pull requests always run, so the `docs-ok` check main requires always
# reports; `changes` skips the build when the docs didn't change.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
  # Redeploy main by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    outputs:
      docs: ${{ steps.check.outputs.docs }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ $GITHUB_EVENT_NAME != pull_request ]]; then echo "docs=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          docs=false
          while read -r file; do
            case $file in docs/* | .github/workflows/docs.yml) docs=true ;; esac
          done < <(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      # Fails on any broken internal link (starlight-links-validator).
      - run: npm run build
      - run: npx wrangler deploy --dry-run

  # Main only (on push or by hand), once the build passes. The Cloudflare token
  # lives in the docs environment, which GitHub opens to main alone, and only the
  # deploy step sees it: never npm ci or the build.
  deploy:
    needs: docs
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'xena-studios/plugins' }}
    runs-on: ubuntu-26.04
    environment:
      name: docs
      url: https://docs.xenastudios.co
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not sensitive (it's in every dashboard URL), so a variable, not a secret.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # The one check main requires: passes when the build passed or was skipped
  # because the docs didn't change.
  docs-ok:
    needs: [changes, docs, deploy]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "ok"
