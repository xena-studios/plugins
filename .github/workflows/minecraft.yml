name: New Minecraft

# Daily, opens a PR when Paper has a stable build of a Minecraft version newer
# than the newest in xena.gameVersions (see scripts/new-minecraft.sh). The PR
# boots every plugin on it; merging lists the plugins for it on their next release.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: new
        run: |
          added=$(scripts/new-minecraft.sh | paste -sd, -)
          echo "versions=$added" >> "$GITHUB_OUTPUT"
          echo "newest=${added##*,}" >> "$GITHUB_OUTPUT"
      - if: steps.new.outputs.versions != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ steps.new.outputs.versions }}
          NEWEST: ${{ steps.new.outputs.newest }}
        run: |
          branch="minecraft-$NEWEST"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already has a PR"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "build: support Minecraft ${VERSIONS//,/, }"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "build: support Minecraft ${VERSIONS//,/, }" \
            --body "Paper has a stable build of Minecraft ${VERSIONS//,/, }. This lists the plugins for it on Modrinth (from their next release), and moves the boot tests and the newest-API compile onto $NEWEST.

          Merge if the checks pass. If they fail, the plugins need a fix for $NEWEST first."
          # PRs opened with this workflow's token don't start other workflows, so start CI here.
          gh workflow run plugins.yml --ref "$branch"
