name: Store pages

# Publishes <plugin>/modrinth.md as the plugin's Modrinth and Hangar project pages
# when it changes on main, or every page when run by hand. Releases publish it too.
# Hangar is skipped for a plugin with no Hangar project yet (xena.hangarId).
on:
  push:
    branches: [main]
    paths: ["*/modrinth.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency: store-pages

jobs:
  sync:
    runs-on: ubuntu-26.04
    # A hung build or upload fails the job instead of holding a runner for six hours.
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plugins
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            # glob magic: * stops at a slash, so scripts/new-plugin/template/ is left out.
            changed=$(git diff --name-only "$BEFORE" HEAD -- ':(glob)*/modrinth.md')
          else
            changed=$(printf '%s\n' ./*/modrinth.md | sed 's#^\./##')
          fi
          tasks=$(for f in $changed; do printf ':%s:modrinthSyncBody :%s:syncAllPagesToHangar ' "${f%/modrinth.md}" "${f%/modrinth.md}"; done)
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
      - if: steps.plugins.outputs.tasks != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - if: steps.plugins.outputs.tasks != ''
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - if: steps.plugins.outputs.tasks != ''
        run: |
          read -ra tasks <<<"$TASKS"
          ./gradlew "${tasks[@]}"
        env:
          TASKS: ${{ steps.plugins.outputs.tasks }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
