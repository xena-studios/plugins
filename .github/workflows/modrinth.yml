name: Store pages

# Publishes <plugin>/modrinth.md as the plugin's Modrinth and Hangar project pages
# when it changes on main, or every page when run by hand. Releases publish it too.
# Hangar is skipped for a plugin with no Hangar project yet (xena.hangarId, or a rewrite's
# xenaRelease hangarId). A rewritten plugin's page goes through its release project's
# releaseStorePage (xena.release), which checks it against both stores' limits first; a new
# plugin's page is modrinth.draft.md, which nothing publishes, until its release pull request
# renames it.
on:
  push:
    branches: [main]
    paths: ["*/modrinth.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency: store-pages

jobs:
  sync:
    runs-on: ubuntu-26.04
    # A hung build or upload fails the job instead of holding a runner for six hours.
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plugins
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            # glob magic: * stops at a slash, so scripts/new-plugin/template/ is left out.
            changed=$(git diff --name-only "$BEFORE" HEAD -- ':(glob)*/modrinth.md')
          else
            changed=$(printf '%s\n' ./*/modrinth.md | sed 's#^\./##')
          fi
          tasks=""
          for f in $changed; do
            plugin=${f%/modrinth.md}
            if [[ -f $plugin/common/build.gradle.kts && ! -f $plugin/build.gradle.kts ]]; then
              # The rewrite's layout: the project on xena.release, found the way release.yml does
              # (a "<plugin> <path> <version> <folder>" line from releaseInfo), without Gradle here:
              # the one build file under the plugin's folder that applies it.
              build=$(grep -l 'id("xena.release")' "$plugin"/*/build.gradle.kts)
              project=":${build%/build.gradle.kts}"
              tasks+="${project//\//:}:releaseStorePage "
            else
              tasks+=":$plugin:modrinthSyncBody :$plugin:syncAllPagesToHangar "
            fi
          done
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
      - if: steps.plugins.outputs.tasks != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - if: steps.plugins.outputs.tasks != ''
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - if: steps.plugins.outputs.tasks != ''
        run: |
          read -ra tasks <<<"$TASKS"
          ./gradlew "${tasks[@]}"
        env:
          TASKS: ${{ steps.plugins.outputs.tasks }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
