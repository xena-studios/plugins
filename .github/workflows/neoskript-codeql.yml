name: NeoSkript CodeQL

# Code scanning for NeoSkript's Java, traced through its own Gradle build (neoskript/ isn't in the
# root build the CodeQL workflow compiles until N1, #203). Its JavaScript and TypeScript, and the
# workflows, are the CodeQL workflow's.
on:
  push:
    branches: [main]
    paths: ["neoskript/**", ".github/workflows/neoskript-codeql.yml"]
  pull_request:
    paths: ["neoskript/**", ".github/workflows/neoskript-codeql.yml"]
  schedule:
    # Weekly, for new queries against unchanged code.
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: neoskript-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (neoskript java-kotlin)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Gradle runs on 25 and compiles with the Java 21 toolchain, so both are needed.
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: neoskript
          cache-read-only: true
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      # CodeQL reads the code as javac compiles it, so every source file has to
      # really compile here: no build cache, no daemon, every task rerun.
      - working-directory: neoskript
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks compileJava compileTestJava
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin/neoskript
