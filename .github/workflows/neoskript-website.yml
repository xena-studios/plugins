name: NeoSkript website

# neoskript.dev (neoskript/website/): built on every pull request that touches it,
# deployed from main. Also redeployed after the NeoSkript workflow finishes on main, so
# the download page picks up the development build that run published.
on:
  push:
    branches: [main]
    paths: [neoskript/website/**, neoskript/neoskript-api/**, neoskript/neoskript-frontend/**, neoskript/neoskript-web/**, neoskript/plugins/skript/**, neoskript/gradle/**, .github/workflows/neoskript-website.yml]
  pull_request:
    paths: [neoskript/website/**, neoskript/neoskript-api/**, neoskript/neoskript-frontend/**, neoskript/neoskript-web/**, neoskript/plugins/skript/**, neoskript/gradle/**, .github/workflows/neoskript-website.yml]
  workflow_run:
    workflows: [NeoSkript]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoskript-website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: neoskript/website

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The parser (website/src/parser/) is NeoSkript's frontend compiled by TeaVM, built by `pnpm build`
      # through Gradle, so the site always ships the parser of the commit it's built from.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: neoskript
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: neoskript/website/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: neoskript/website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Read-only, for the download page's release lookup (no rate limit).
          GITHUB_TOKEN: ${{ github.token }}

  # Main only, once the build passes. The Cloudflare token lives in the docs environment
  # (the plugins' site deploys from it too), which GitHub opens to main alone, and only the
  # deploy step sees it: never the install or the build.
  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'xena-studios/plugins' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment:
      name: docs
      url: https://neoskript.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: neoskript
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: neoskript/website/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: neoskript/website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not sensitive (it's in every dashboard URL), so a variable, not a secret.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
