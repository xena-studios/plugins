name: Plugins

# Everything but the docs, except the files the plugins' tests generate for them.
# Pull requests always run, so the `plugins-ok` check main requires always reports;
# `changes` skips the rest when only the docs or Markdown changed.
on:
  push:
    branches: [main]
    paths: ["**", "!docs/**", "docs/src/generated/**", "!**.md", "!.github/workflows/docs.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    outputs:
      plugins: ${{ steps.check.outputs.plugins }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ $GITHUB_EVENT_NAME != pull_request ]]; then echo "plugins=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          plugins=false
          while read -r file; do
            case $file in
              *.md | .github/workflows/docs.yml) ;;
              docs/src/generated/*) plugins=true ;;
              docs/*) ;;
              *) plugins=true ;;
            esac
          done < <(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # Compiles, runs the tests, and fails any jar over its size budget.
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          # Plugin jars only: core and build-logic are libraries, and -plain
          # jars lack the core.
          path: |
            */build/libs/*.jar
            !core/build/libs/*
            !build-logic/build/libs/*
            !*/build/libs/*-plain.jar
          if-no-files-found: error

  # Compiles against the newest Paper API, failing on anything it marks for
  # removal, so a coming break shows up here before it reaches a server.
  newest-api:
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # Keep in step with the newest Paper release, as in the boot matrix below.
      - run: ./gradlew compileJava -Pxena.newestPaper=26.3.build.211-stable

  # Boots every plugin on a real server, at the oldest version we support and
  # the newest, on Paper and Folia.
  boot:
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        project: [paper, folia]
        # Keep the first in step with `paper` in gradle/libs.versions.toml, and
        # the second at the newest release.
        target:
          - { version: "1.21.11", java: 21 }
          - { version: "26.3", java: 25 }
    name: boot (${{ matrix.project }} ${{ matrix.target.version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.target.java }}
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars
      - uses: actions/cache@v6
        with:
          path: .cache/servers
          key: servers-${{ matrix.project }}-${{ matrix.target.version }}
      # Runs each module's boot-checks.txt against all the jars at once.
      - run: |
          checks=()
          for file in */boot-checks.txt; do checks+=(--checks "$file"); done
          mapfile -t jars < <(find jars -name '*.jar' | sort)
          scripts/boot-test.sh --project ${{ matrix.project }} --version ${{ matrix.target.version }} \
            "${checks[@]}" "${jars[@]}"

  # The one check main requires: passes when every job above passed or was
  # skipped because nothing they cover changed.
  plugins-ok:
    needs: [changes, build, newest-api, boot]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "ok"
