name: Plugins

# Everything but the docs, except the files the plugins' tests generate for them.
# Pull requests always run, so the `plugins-ok` check main requires always reports;
# `changes` skips the rest when only the docs or Markdown changed.
on:
  push:
    branches: [main]
    paths: ["**", "!docs/**", "docs/src/generated/**", "!**.md", "!.github/workflows/docs.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it replaces.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    outputs:
      plugins: ${{ steps.check.outputs.plugins }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ $GITHUB_EVENT_NAME != pull_request ]]; then echo "plugins=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Read first, so a failed call fails the step instead of skipping the build.
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          plugins=false
          while read -r file; do
            case $file in
              *.md | .github/workflows/docs.yml) ;;
              docs/src/generated/*) plugins=true ;;
              docs/*) ;;
              *) plugins=true ;;
            esac
          done <<< "$files"
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-26.04
    # A hung test or server fails the job instead of holding a runner for six hours.
    timeout-minutes: 30
    outputs:
      newest: ${{ steps.newest.outputs.minecraft }}
    # A real MariaDB, so xRewind's MySqlTest runs the same SQL its MySQL users do.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: xr
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      # The newest Minecraft CI boots, from gradle.properties, for the boot matrix.
      - id: newest
        run: echo "minecraft=$(sed -n 's/^xena\.ciNewestMinecraft=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Compiles, runs the tests, and fails any jar over its size budget.
      - run: ./gradlew build
        env:
          XR_MYSQL: 127.0.0.1:3306:xr:root:ci
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          # Plugin jars only: core and build-logic are libraries, and -plain
          # jars lack the core.
          path: |
            */build/libs/*.jar
            sandbox/consumer/build/libs/*.jar
            sandbox/paper-consumer/build/libs/*.jar
            !core/build/libs/*
            !build-logic/build/libs/*
            !*/build/libs/*-plain.jar
          if-no-files-found: error

  # Compiles against the newest Paper API, failing on anything it marks for
  # removal, so a coming break shows up here before it reaches a server.
  newest-api:
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-26.04
    # A hung test or server fails the job instead of holding a runner for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The build scripts/new-minecraft.sh keeps in gradle.properties.
      - run: ./gradlew compileJava -Pxena.newestPaper="$(sed -n 's/^xena\.ciNewestPaperApi=//p' gradle.properties)"

  # Boots every plugin on a real server, at the oldest version we support and
  # the newest, on Paper and Folia.
  boot:
    needs: build
    runs-on: ubuntu-26.04
    # A hung test or server fails the job instead of holding a runner for six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [paper, folia]
        # The minimum (keep in step with `paper` in gradle/libs.versions.toml), and the
        # newest release from gradle.properties, which scripts/new-minecraft.sh moves.
        target: ${{ fromJSON(format('[{{"version":"1.21.11","java":21}},{{"version":"{0}","java":25}}]', needs.build.outputs.newest)) }}
    name: boot (${{ matrix.project }} ${{ matrix.target.version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.target.java }}
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars
      # The server build boot-test.sh will download, so the cache refreshes when Paper
      # or Folia ships a new one instead of keeping the first forever.
      - id: server
        env:
          PROJECT: ${{ matrix.project }}
          VERSION: ${{ matrix.target.version }}
        run: echo "build=$(curl -fsS "https://fill.papermc.io/v3/projects/$PROJECT/versions/$VERSION/builds/latest" | jq -r .id)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/servers
          key: servers-${{ matrix.project }}-${{ matrix.target.version }}-${{ steps.server.outputs.build }}
          restore-keys: servers-${{ matrix.project }}-${{ matrix.target.version }}-
      # Runs each module's boot-checks.txt against all the jars at once.
      - run: |
          checks=()
          for file in */boot-checks.txt; do checks+=(--checks "$file"); done
          mapfile -t jars < <(find jars -name '*.jar' | sort)
          scripts/boot-test.sh --project ${{ matrix.project }} --version ${{ matrix.target.version }} \
            "${checks[@]}" "${jars[@]}"

  # The one check main requires: passes when every job above passed or was
  # skipped because nothing they cover changed.
  plugins-ok:
    needs: [changes, build, newest-api, boot]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "ok"
