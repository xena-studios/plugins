name: Release

# Push a tag named <module>-v<version>, such as xutilities-v2.0.0, to publish
# that plugin to Modrinth, Hangar, voxel.shop and GitHub, and its API (if it has
# one) to Maven Central. Hangar and voxel.shop are skipped for a plugin that has
# no project there yet (xena.hangarId, xena.voxelId). The version must match the
# module's build.gradle.kts, and <module>/CHANGELOG.md must have a "## <version>"
# section.
# `node scripts/release.ts --tag <pr-number>` pushes these once a release PR is merged
# (CONTRIBUTING.md, "Releasing"). Last, the site is redeployed.
on:
  push:
    tags: ["*-v*"]

# Nothing by default; each job asks for what it needs. The job that builds (and so
# runs the project's own Gradle scripts) can only read the repo; the job that can
# write to it runs no project code.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-26.04
    # A hung build or upload fails the job instead of holding a runner for six hours. Generous,
    # since Maven Central can take a while to accept a release.
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    outputs:
      module: ${{ steps.tag.outputs.module }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # All of main, to check the tag is on it.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Read the tag
        id: tag
        run: |
          tag=${GITHUB_REF_NAME}
          module=${tag%-v*}
          version=${tag##*-v}
          [[ $module =~ ^[a-z0-9-]+$ && $version =~ ^[0-9A-Za-z.+-]+$ ]] \
            || { echo "::error::$tag isn't <module>-v<version>"; exit 1; }
          [[ -f $module/build.gradle.kts && $module != core && $module != sandbox ]] \
            || { echo "::error::$module isn't a releasable plugin"; exit 1; }
          built=$(./gradlew -q ":$module:properties" --property version | sed -n 's/^version: //p')
          [[ $built == "$version" ]] \
            || { echo "::error::the tag says $version but $module/build.gradle.kts says $built"; exit 1; }
          # Only what's been reviewed and merged is released: a tag on a branch's commit isn't.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$tag isn't on main; release from a merged commit"; exit 1; }
          echo "module=$module" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Read the changelog
        env:
          MODULE: ${{ steps.tag.outputs.module }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          scripts/changelog.sh "$MODULE/CHANGELOG.md" "$VERSION" >"$RUNNER_TEMP/release/changelog.md"
          # For the Modrinth version's changelog. A random delimiter, so no line of the
          # changelog can end the value early and set other variables.
          delimiter="CHANGELOG_$(openssl rand -hex 16)"
          {
            echo "CHANGELOG<<$delimiter"
            cat "$RUNNER_TEMP/release/changelog.md"
            echo "$delimiter"
          } >>"$GITHUB_ENV"
      - name: Build
        env:
          MODULE: ${{ steps.tag.outputs.module }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          ./gradlew ":$MODULE:build"
          jar="$MODULE/build/libs/$MODULE-$VERSION.jar"
          cp "$jar" "$RUNNER_TEMP/release/"
          # Titled with the plugin's own name, such as "xUtilities 2.0.0", from its descriptor.
          echo "$(unzip -p "$jar" paper-plugin.yml | sed -n 's/^name: //p') $VERSION" >"$RUNNER_TEMP/release/title.txt"
      - name: Publish the API to Maven Central
        # As co.xenastudios.<module>:<module>-api, signed, through the Central Portal, and
        # released straight away: the tag is the decision. First, so a POM or signature
        # Central refuses stops the release before anything is public. A rerun skips it
        # once that version is on Central (that takes up to about 30 minutes).
        env:
          MODULE: ${{ steps.tag.outputs.module }}
          VERSION: ${{ steps.tag.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [[ ! -f $MODULE/api/build.gradle.kts ]]; then
            echo "$MODULE has no API"; exit 0
          fi
          for secret in mavenCentralUsername mavenCentralPassword signingInMemoryKey signingInMemoryKeyPassword; do
            var="ORG_GRADLE_PROJECT_$secret"
            [[ -n ${!var} ]] || { echo "::error::the release environment is missing the secret for $secret"; exit 1; }
          done
          url="https://repo1.maven.org/maven2/co/xenastudios/$MODULE/$MODULE-api/$VERSION/$MODULE-api-$VERSION.pom"
          if curl -sfI "$url" >/dev/null; then
            echo "$MODULE-api $VERSION is already on Maven Central"; exit 0
          fi
          ./gradlew ":$MODULE:api:publishAndReleaseToMavenCentral"
      # Each store skips a version it already has, so a rerun after one fails picks up
      # where it stopped.
      - name: Publish to Modrinth
        # The version, then the project page from <module>/modrinth.md.
        env:
          MODULE: ${{ steps.tag.outputs.module }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew ":$MODULE:modrinth" ":$MODULE:modrinthSyncBody"
      - name: Publish to Hangar
        # The version, then the project page, also from <module>/modrinth.md.
        env:
          MODULE: ${{ steps.tag.outputs.module }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: ./gradlew ":$MODULE:publishPluginPublicationToHangar" ":$MODULE:syncAllPagesToHangar"
      - name: Publish to voxel.shop
        # The version, with the changelog as its update post. voxel.shop's API can't edit
        # the resource page, so that's kept by hand.
        env:
          MODULE: ${{ steps.tag.outputs.module }}
          VOXEL_API_KEY: ${{ secrets.VOXEL_API_KEY }}
        run: ./gradlew ":$MODULE:voxel"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release/
          retention-days: 7

  github:
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout: this job only uploads what the publish job built.
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Publish to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE: ${{ needs.publish.outputs.module }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          prerelease=()
          [[ $VERSION == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$(cat release/title.txt)" \
            --notes-file release/changelog.md \
            "${prerelease[@]}" \
            "release/$MODULE-$VERSION.jar"

  # Redeploys the plugin site once the release is out, so its version info is current.
  # Only starts the Docs workflow: no checkout and no project code, and the one
  # permission it needs, to dispatch a workflow.
  docs:
    needs: github
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Redeploy the docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
