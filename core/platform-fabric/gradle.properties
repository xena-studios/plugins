# Loom keeps Minecraft and the remapped jars in ~/.gradle/caches/fabric-loom; this build only
# needs the room to remap them.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
# fabric-language-kotlin brings the stdlib to the server; nothing compiles against another.
kotlin.stdlib.default.dependency=false
# As the root build: Loom and Stonecutter keep to it, so an unchanged build skips configuring
# Minecraft for every version.
org.gradle.configuration-cache=true
# build-logic's conventions find the repo's gradle/jar-budgets.txt and gradle/library-pins.txt
# there, and name this build's projects by their path in the repo (:core:platform-fabric:...).
xena.repoRoot=../..
xena.projectPrefix=:core:platform-fabric
