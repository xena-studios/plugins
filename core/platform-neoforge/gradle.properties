# ModDevGradle keeps Minecraft and NeoForge's patched jars in ~/.gradle/caches; this build only
# needs the room to set them up.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
# Kotlin for Forge brings the stdlib to the server; nothing compiles against another.
kotlin.stdlib.default.dependency=false
# As the root build: an unchanged build skips configuring Minecraft for every version.
org.gradle.configuration-cache=true
# build-logic's conventions find the repo's gradle/jar-budgets.txt and gradle/library-pins.txt
# there, and name this build's projects by their path in the repo (:core:platform-neoforge:...).
xena.repoRoot=../..
xena.projectPrefix=:core:platform-neoforge
