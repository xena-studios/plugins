# Dependencies allowed to run install scripts (pnpm runs none by default):
# esbuild and workerd fetch their platform binaries for Astro and Wrangler.
allowBuilds:
  esbuild: true
  workerd: true

# Security fixes for transitive dependencies. Drop each once its parent
# depends on a patched version.
# undici 7: Miniflare (via Wrangler) pins a version before 7.30.1, which
# fixes GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm,
# GHSA-9fm3-97px-rjf6 and GHSA-xjj6-f33q-929c.
overrides:
  'undici@>=7.0.0 <7.30.1': 7.30.1
