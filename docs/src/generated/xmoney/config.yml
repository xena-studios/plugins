# xMoney: the economy, and Vault, in one plugin.
# Docs: https://plugins.xenastudios.co/xmoney/configuration/
#
# Apply changes with /xmoney reload. A bad value falls back to its default with a
# warning in the console; xMoney never stops over config. The messages are in lang/.

# Managed by the plugin, to carry your settings forward on updates. Don't edit it.
config-version: 2

# How this plugin's messages look, and the language they're in. shared uses the
# setting in plugins/Xena/config.yml, which every Xena plugin reads; anything else is
# this plugin's own.
messages:
  # The language players see messages in: auto for each player's own (their client's
  # language setting), or one language for everyone, such as de or pt-BR.
  language: "shared"
  # The language of the console, and of players whose language has no file in lang/.
  default-language: "shared"

  # The look every message shares, used in messages as tags: <prefix>, <highlight>,
  # <success> and <error>. Colours are names (gray, gold) or hex (#B48CFF), with bold,
  # italic, underlined, strikethrough or obfuscated if you like: <#B48CFF><bold>.
  theme:
    # <prefix> starts the default messages. Make it your server's name, such as
    # "<dark_gray>[<gradient:#B48CFF:#5EE08A>MyServer</gradient>]</dark_gray> ", or blank for none.
    prefix: "shared"
    # The colour of message text that has no tag of its own.
    base: "shared"
    # <highlight>: names and values, such as a player or a speed.
    highlight: "shared"
    # <success>: something turned on or done.
    success: "shared"
    # <error>: something refused or turned off.
    error: "shared"

# How money looks. Other plugins show it this way too, through Vault's format.
currency:
  # The currency's name for one, and for more than one.
  singular: "dollar"
  plural: "dollars"
  symbol: "$"
  # Decimal places: 2 for cents, 0 for whole coins. At most 4. Amounts are shown with
  # these, and amounts typed into commands may have at most this many. Other plugins'
  # amounts keep 4 places, so a payment split in two costs what it would whole.
  # Lowering it later keeps the parts of balances it no longer shows.
  decimals: 2
  # How an amount is written. {amount} is the number, {symbol} the symbol, and {name}
  # the singular or plural name: "{amount} {name}" gives "12.50 dollars".
  format: "{symbol}{amount}"
  # Put between thousands, as in 1,000,000. Blank for none.
  thousands-separator: ","
  decimal-separator: "."
  # The short form's thousands, millions, billions and trillions, as in 1.2k.
  short-suffixes: ["k", "M", "B", "T"]

# What a player has the first time they join. Players who already have an account keep
# theirs.
starting-balance: 0

# The most one account can hold. Payments that would take a balance over it are refused.
# At most 100,000,000,000,000.
max-balance: 1000000000000

# Each command can be turned off (enabled: false, so another plugin can have its name),
# given other aliases, or need another permission. A blank permission lets everyone use it.
commands:

  # /balance [player]: a player's balance. Someone else's needs permission-others.
  balance:
    enabled: true
    aliases: ["bal", "money"]
    permission: ""
    permission-others: "xmoney.balance.others"

  # /pay <player> <amount>: send money to another player, online or not.
  pay:
    enabled: true
    aliases: []
    permission: ""
    # The least one payment can be.
    minimum: 0.01
    # Payments of this much or more ask the player to confirm first. 0 never asks.
    confirm-above: 0

  # /baltop [page]: the richest players.
  baltop:
    enabled: true
    aliases: ["balancetop", "moneytop"]
    permission: ""
    per-page: 10

  # /eco give|take|set|reset|history: staff commands. Each part has its own permission:
  # xmoney.eco.give, .take, .set, .reset and .history.
  eco:
    enabled: true
    aliases: ["economy"]
    permission: "xmoney.eco"

# The ledger: every change to every balance, for /eco history.
ledger:
  # Delete ledger rows older than this many days, checked at startup and once a day. 0
  # keeps them all. Balances never depend on old rows.
  keep-days: 365

# Where this plugin keeps its data. Read at startup only: restart after changing it.
storage:
  # sqlite keeps everything in one file in the plugin's folder, with nothing to set up.
  # mysql (or MariaDB) is for networks, or servers with a lot of history.
  # shared keeps it in the database every Xena plugin can share, set in plugins/Xena/config.yml.
  type: "sqlite"
  # Put in front of every table's name, so plugins and servers can share one database.
  table-prefix: "xmoney_"

  # Only for type: mysql.
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "minecraft"
    password: ""
    # Extra connection settings, as in a JDBC URL: useSSL=true&serverTimezone=UTC.
    properties: ""

  # The connections used to read, beside the one that writes.
  pool:
    # How many: 0 picks for the database (1 for SQLite, 2 for MySQL). More helps only a
    # MySQL server that many reads wait on.
    readers: 0

# For several servers sharing balances through one MySQL or MariaDB database. Every
# server must use the same storage settings and table-prefix. Read at startup only.
# Experimental: a withdrawal is decided by the shared database, so a shop's Vault call
# waits for it on the server thread (see network-wait-ms), and while the database is
# away, withdrawals are refused. Money is never lost or made either way.
network:
  # On when several servers share this plugin's MySQL or MariaDB database. Leave it off
  # for a single server: it does nothing on SQLite.
  enabled: false
  # Seconds between checks for the other servers' changes.
  check-every: 3

# On a network: the longest, in milliseconds, a withdrawal made on a server thread (a
# shop's Vault call) waits for the shared database to take it up. If it hasn't, it's
# refused and nothing is taken. At most 250, so a slow database can't stall the server.
# Commands and xMoney's API don't hold a server thread, so they wait up to 5 seconds.
network-wait-ms: 50

# Telling you when a newer version is out: in the console, and to players with
# <plugin>.admin.update when they join. Asks Modrinth once a day, off the server's threads,
# sending only the plugin's version, the platform and the Minecraft version.
updates:
  # Whether to ask at all.
  check: true
  # Which releases to hear of: release, beta (betas and releases) or alpha (everything).
  channel: "release"
