# xVote: votes in, rewards out.
# Docs: https://plugins.xenastudios.co/xvote/configuration/
#
# Apply changes with /xvote reload. A bad value falls back to its default with a
# warning in the console; xVote never stops over config. The messages are in lang/.

# Managed by the plugin, to carry your settings forward on updates. Don't edit it.
config-version: 2

# How this plugin's messages look, and the language they're in. shared uses the
# setting in plugins/Xena/config.yml, which every Xena plugin reads; anything else is
# this plugin's own.
messages:
  # The language players see messages in: auto for each player's own (their client's
  # language setting), or one language for everyone, such as de or pt-BR.
  language: "shared"
  # The language of the console, and of players whose language has no file in lang/.
  default-language: "shared"

  # The look every message shares, used in messages as tags: <prefix>, <highlight>,
  # <success> and <error>. Colours are names (gray, gold) or hex (#B48CFF), with bold,
  # italic, underlined, strikethrough or obfuscated if you like: <#B48CFF><bold>.
  theme:
    # <prefix> starts the default messages. Make it your server's name, such as
    # "<dark_gray>[<gradient:#B48CFF:#5EE08A>MyServer</gradient>]</dark_gray> ", or blank for none.
    prefix: "shared"
    # The colour of message text that has no tag of its own.
    base: "shared"
    # <highlight>: names and values, such as a player or a speed.
    highlight: "shared"
    # <success>: something turned on or done.
    success: "shared"
    # <error>: something refused or turned off.
    error: "shared"

# The Votifier receiver: where server lists send votes. It speaks Votifier v1 and v2,
# like NuVotifier, and uses the keys in rsa/ and the tokens in tokens.yml. Don't run
# NuVotifier as well: both would want the same port. On a network, turn it on on the
# proxy and off on the servers: the proxy receives every vote and the player's server
# pays it. Changes apply on /xvote reload.
receiver:
  # Off stops listening; votes from /vote test and other plugins still count.
  enabled: true
  # The address to listen on. 0.0.0.0 is every address the machine has.
  host: "0.0.0.0"
  # The port lists send votes to. It must be open to the internet, and isn't the
  # server's own port. On a host that gives you one port, see the docs.
  port: 8192
  # Accept Votifier v1 votes. Most lists still send v1; turn it off only if all yours send v2.
  v1: true
  # Most votes handled at once. More are turned away until one finishes.
  max-connections: 256
  # Most connections open at once from one address, so a few can't take every slot.
  # 0 is no limit. Behind a tunnel (playit.gg, TCPShield) every list arrives from the
  # tunnel's address: raise this and per-ip-per-minute, or set both to 0.
  per-ip-connections: 4
  # Seconds a list has to send its vote before the connection is closed.
  timeout-seconds: 10
  # Most connections one address may make a minute. A list makes one per vote. 0 is no limit.
  per-ip-per-minute: 60
  # On a server behind a proxy that runs NuVotifier instead of xVote: the plugin channel
  # NuVotifier forwards votes on with its pluginMessaging method (nuvotifier:votes), or
  # blank for none. A player's client can send on any channel, so only set it when the
  # proxy drops players' messages on it; NuVotifier's proxy method (a v2 vote to this
  # receiver with a token) needs nothing here and can't be forged. Bukkit only.
  nuvotifier-channel: ""

# The sites players vote on, shown by /vote. Each is matched to votes by its service:
# the name the list sends, which /xvote status shows for the last votes. name is
# what players see. A vote sooner than cooldown-hours after the last one from the same
# site is a repeat and is dropped; set it to how often the site lets players vote.
# rewards are given for this site only, on top of every-vote's. Votes from a site
# that isn't listed still count, with counting.unlisted-cooldown-hours as cooldown.
sites:
  planetminecraft:
    name: "Planet Minecraft"
    service: "PlanetMinecraft.com"
    link: "https://www.planetminecraft.com/server/your-server/vote/"
    cooldown-hours: 24
    rewards: []
  minecraft-mp:
    name: "Minecraft-MP"
    service: "Minecraft-MP.com"
    link: "https://minecraft-mp.com/server/00000/vote/"
    cooldown-hours: 24
    rewards: []

# Rewards, by name, to use in triggers, sites and the party. Each can give money
# (through xMoney, or Vault's economy on Bukkit), items, console commands, a message, a
# broadcast and a sound, with a chance in percent. Items are written like /give: diamond 3,
# or diamond_sword[enchantments={sharpness:3}] 1 (components on Paper 1.20.5+ and Fabric).
# Items that don't fit wait for /vote claim (on Fabric they drop at the player's feet).
# Commands, messages and broadcasts can use <player>, <uuid>, <site>, <total> and <streak>;
# in commands, <site> is a listed site's key (planetminecraft), and one that isn't listed
# keeps only letters, digits, . _ and -. custom lists reward types other plugins add, as
# "<type> <argument>".
rewards:
  vote:
    chance: 100
    money: 0
    items: ["diamond 1"]
    commands: []
    message: "<prefix><success>Thanks for voting</success> on <highlight><site></highlight>! Here's a diamond."
    broadcast: "<prefix><highlight><player></highlight> voted on <site>. <click:run_command:'/vote'><highlight>/vote</highlight></click> to vote too."
    sound: "entity.player.levelup"
    custom: []
  streak:
    chance: 100
    money: 0
    items: ["diamond 5"]
    commands: []
    message: "<prefix>A <highlight><streak>-day</highlight> voting streak! Here are 5 more diamonds."
    broadcast: ""
    sound: ""
    custom: []
  party:
    chance: 100
    money: 0
    items: ["golden_apple 1"]
    commands: []
    message: "<prefix><success>Vote party!</success> Here's a golden apple."
    broadcast: ""
    sound: "entity.firework_rocket.blast"
    custom: []

# Which rewards each vote gives, besides its site's. every-vote: on every vote.
# first-vote-of-day: a player's first vote each day. every: on every Nth vote, by N.
# streak: on reaching that many days in a row. total: once, on reaching that many votes.
triggers:
  every-vote: ["vote"]
  first-vote-of-day: []
  every: {}
  streak:
    7:
      rewards: ["streak"]
  total: {}

# Every so many votes from anyone, a reward for everyone online (who: online), or for
# everyone online who voted since the last party (who: voted). On a network the count is
# the network's, and every server rewards its own players. The broadcasts are in lang/.
party:
  enabled: false
  # Votes from anyone a party needs.
  votes: 50
  # online or voted.
  who: "online"
  rewards: ["party"]
  # Broadcast party.progress every this many votes on the way. 0 is never.
  progress-every: 10

# Telling players they can vote. The words are reminders.message in lang/.
reminders:
  # Remind players who can vote when they join.
  on-join: true
  # Seconds after joining.
  join-delay-seconds: 5
  # Also remind everyone online who can vote, every this many minutes. 0 is off, and
  # then nothing repeats.
  every-minutes: 0

# How votes are counted.
counting:
  # Days, weeks and months start at midnight here: an id like Europe/London or
  # America/New_York, or server for the server's own. On a network, give every server
  # and the proxy the same one.
  time-zone: "server"
  # The day weeks start on.
  week-starts: "monday"
  # Floodgate's prefix for Bedrock players' names. A vote for a name nobody has is
  # tried with it, so Bedrock players who leave it off are still paid.
  bedrock-prefix: "."
  # Days to keep votes for names that have never joined. They're paid if that name
  # joins in time. 0 keeps them forever.
  unknown-name-days: 30
  # The cooldown for sites that aren't in sites: a second vote from one sooner is a
  # repeat and is dropped, as a listed site's are. 0 drops only exact replays.
  unlisted-cooldown-hours: 24

# Where this plugin keeps its data. Read at startup only: restart after changing it.
storage:
  # sqlite keeps everything in one file in the plugin's folder, with nothing to set up.
  # mysql (or MariaDB) is for networks, or servers with a lot of history.
  # shared keeps it in the database every Xena plugin can share, set in plugins/Xena/config.yml.
  type: "sqlite"
  # Put in front of every table's name, so plugins and servers can share one database.
  table-prefix: "xvote_"

  # Only for type: mysql.
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "minecraft"
    password: ""
    # Extra connection settings, as in a JDBC URL: useSSL=true&serverTimezone=UTC.
    properties: ""

  # The connections used to read, beside the one that writes.
  pool:
    # How many: 0 picks for the database (1 for SQLite, 2 for MySQL). More helps only a
    # MySQL server that many reads wait on.
    readers: 0

# For networks: every server (and the proxy, if xVote is on it) shares one MySQL or
# MariaDB database (storage), so a vote that arrives anywhere is paid once, on the server
# the player is on, or the first one they join. Applies on restart.
network:
  # On when several servers share this plugin's MySQL or MariaDB database, so a change
  # made on one (a vote, a party) reaches the others within a few seconds.
  # Leave it off for a single server: it does nothing on SQLite.
  enabled: false
  # Seconds between checks for the other servers' changes.
  check-every: 3

# Telling you when a newer version is out: in the console, and to players with
# <plugin>.admin.update when they join. Asks Modrinth once a day, off the server's threads,
# sending only the plugin's version, the platform and the Minecraft version.
updates:
  # Whether to ask at all.
  check: true
  # Which releases to hear of: release, beta (betas and releases) or alpha (everything).
  channel: "release"
