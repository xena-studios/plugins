# zChat: format your chat. Keep it clean.
# Docs: https://plugins.xenastudios.co/zchat/configuration/
#
# Apply changes with /zchat reload (or /zc reload). Everything applies, even turning
# commands on or off. A bad value falls back to its default with a warning in the
# console; zChat never stops over config. Formats are in MiniMessage's tags:
# https://plugins.xenastudios.co/start/formatting/. The messages are in lang/.

# Managed by the plugin, to carry your settings forward on updates. Don't edit it.
config-version: 3

# How this plugin's messages look, and the language they're in. shared uses the
# setting in plugins/Xena/config.yml, which every Xena plugin reads; anything else is
# this plugin's own.
messages:
  # The language players see messages in: auto for each player's own (their client's
  # language setting), or one language for everyone, such as de or pt-BR.
  language: "shared"
  # The language of the console, and of players whose language has no file in lang/.
  default-language: "shared"

  # The look every message shares, used in messages as tags: <prefix>, <highlight>,
  # <success> and <error>. Colours are names (gray, gold) or hex (#B48CFF), with bold,
  # italic, underlined, strikethrough or obfuscated if you like: <#B48CFF><bold>.
  theme:
    # <prefix> starts the default messages. Make it your server's name, such as
    # "<dark_gray>[<gradient:#B48CFF:#5EE08A>MyServer</gradient>]</dark_gray> ", or blank for none.
    prefix: "shared"
    # The colour of message text that has no tag of its own.
    base: "shared"
    # <highlight>: names and values, such as a player or a speed.
    highlight: "shared"
    # <success>: something turned on or done.
    success: "shared"
    # <error>: something refused or turned off.
    error: "shared"

# How chat looks. Formats can use <player> (the name), <displayname> (the name with
# any nickname colours), <message>, the theme's tags (<prefix>, <highlight>...), and
# PlaceholderAPI placeholders such as %vault_prefix% when PlaceholderAPI is installed.
formatting:
  # false leaves chat as the server shows it.
  enabled: true
  # Players with this permission can use colour and style tags, such as <red> or
  # <bold>, in their own messages. Never clicks or hovers. Blank lets nobody.
  color-permission: "zchat.chat.color"
  # The format for players in no group below.
  default-format: "<gray><player>:</gray> <white><message></white>"
  # Each group's format goes to players with its permission (zchat.group.<name> if left
  # out). A player in several groups gets the one with the highest weight. Group
  # permissions are given out on purpose: operators don't get them by being operators.
  groups:
    vip:
      weight: 10
      permission: "zchat.group.vip"
      format: "<gold>[VIP] <player></gold> <dark_gray>»</dark_gray> <white><message></white>"
    staff:
      weight: 20
      permission: "zchat.group.staff"
      format: "<aqua>[Staff] <player></aqua> <dark_gray>»</dark_gray> <white><message></white>"
    admin:
      weight: 30
      permission: "zchat.group.admin"
      format: "<red>[Admin] <player></red> <dark_gray>»</dark_gray> <white><message></white>"

# Catches words you don't want in chat and private messages. Players with
# zchat.bypass.filter skip it.
filter:
  enabled: true
  # censor hides what matched and lets the message through; block stops the message.
  mode: "censor"
  censor-char: "*"
  # Also catch words dressed up to get past the filter: s p a c e d out, b4dw0rd,
  # baaadword, bädword. false matches words only as typed.
  smart: true
  # Words to catch, matched as whole words. Put * at either end to also catch longer
  # words: "bad*" catches badly and bads, where "bad" alone misses plurals.
  # /filter add and /filter remove change this list in game.
  words: ["badword1", "badword2"]
  # Regular expressions, matched anywhere in the message as typed, ignoring case.
  # For anything words can't express. Not smart.
  patterns: []

  # /filter: add, remove and list words, and test a message, in game.
  command:
    enabled: true
    aliases: ["chatfilter"]
    permission: "zchat.command.filter"

# The shortest gap between one player's messages. zchat.bypass.cooldown skips it.
cooldown:
  enabled: true
  seconds: 3

# Stops a player sending the same message again soon after. Messages under three
# letters, like "gg", are let through. zchat.bypass.anti-repeat skips it.
anti-repeat:
  enabled: true
  # How long a message counts as recent.
  seconds: 30
  # How alike two messages must be, in percent, to count as a repeat. 100 catches
  # only exact repeats; lower also catches small changes.
  similarity: 90

# Writing a player's name, or @name, highlights it and pings them. Players who've
# hidden chat aren't pinged.
mentions:
  enabled: true
  # How a mention looks, to everyone. <name> is the mentioned player's name.
  format: "<highlight>@<name></highlight>"
  # Played to the mentioned player. Blank for none.
  sound: "entity.experience_orb.pickup 0.5 1.2"
  # Players with this permission can write @everyone to mention everyone. Blank lets
  # nobody.
  everyone-permission: "zchat.mention.everyone"

# Every command has the same settings:
#   enabled     false removes the command entirely
#   aliases     other names for it
#   permission  needed to use it; blank ("") lets anyone
# The messages are in lang/<language>.yml.
#
# /clearchat: clears chat for everyone. zchat.bypass.clearchat keeps a player's.
clearchat:
  enabled: true
  aliases: ["cc"]
  permission: "zchat.command.clearchat"
  # How many blank lines push chat out of view.
  lines: 100

# /mutechat: mutes chat for everyone but zchat.bypass.mute until it's run again.
mutechat:
  enabled: true
  aliases: ["mc"]
  permission: "zchat.command.mutechat"

# /togglechat: hides other players' chat for yourself, or shows it again.
togglechat:
  enabled: true
  aliases: ["tc"]
  permission: "zchat.command.togglechat"
  # Keep a player's choice when they rejoin.
  remember: true

# Private messages. The filter applies to them; the mute and cooldown don't.
private-messages:

  # /msg <player> <message>. Replaces Minecraft's /msg, /tell and /w. <player> is the
  # other player and <message> what was said.
  msg:
    enabled: true
    aliases: ["tell", "w", "whisper", "m", "pm"]
    permission: "zchat.command.msg"
    format-sent: "<highlight>You → <player></highlight><gray>:</gray> <white><message>"
    format-received: "<highlight><player> → You</highlight><gray>:</gray> <white><message>"
    # Played to whoever receives a message. Blank for none.
    sound: "entity.experience_orb.pickup 0.5 1.2"

  # /reply <message>: answers whoever you last messaged, or who last messaged you.
  reply:
    enabled: true
    aliases: ["r"]
    permission: "zchat.command.reply"

  # /socialspy: shows staff every private message. <sender> and <receiver> are filled in.
  socialspy:
    enabled: true
    aliases: ["spy"]
    permission: "zchat.command.socialspy"
    # Keep a player's choice when they rejoin.
    remember: true
    # Also log every private message to the console.
    log-to-console: true
    format: "<dark_gray>[Spy]</dark_gray> <gray><sender> → <receiver>: <message>"

# Chat across a network: with zChat on the Velocity or BungeeCord proxy too, chat on this
# server goes to the others and theirs comes here, and /msg reaches players on any server.
# Needs the network's secret (plugins/Xena/proxy.secret, or Velocity's forwarding secret
# with modern forwarding). Each server checks its own players' messages (the filter, the
# mute, mute providers) before they leave it. Read at startup: restart to turn it on or off.
network:
  enabled: false
  # Chat goes to every server of the network, and theirs comes here.
  chat: true
  # /msg and /reply reach players on other servers.
  private-messages: true
  # Shown before a line from another server. <server> is its name, as the proxy calls it.
  server-format: "<dark_gray>[<server>]</dark_gray> "

# Telling you when a newer version is out: in the console, and to players with
# <plugin>.admin.update when they join. Asks Modrinth once a day, off the server's threads,
# sending only the plugin's version, the platform and the Minecraft version.
updates:
  # Whether to ask at all.
  check: true
  # Which releases to hear of: release, beta (betas and releases) or alpha (everything).
  channel: "release"
