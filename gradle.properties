org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx1g

# Minecraft versions every plugin is listed for on Modrinth: the minimum in
# libs.versions.toml and every release since. Add new ones as they ship.
xena.gameVersions=1.21.11,26.1,26.1.1,26.1.2,26.2,26.3

# What CI checks against besides the minimum: the newest Minecraft (boot-tested on
# Paper and Folia) and the paper-api build the newest-API compile uses. Kept here, not
# in .github/workflows, because the New Minecraft workflow moves them and its token
# can't push changes to workflow files.
xena.ciNewestMinecraft=26.3
xena.ciNewestPaperApi=26.3.build.211-stable
