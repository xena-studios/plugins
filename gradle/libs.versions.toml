[versions]
# The oldest Paper every plugin supports. Raising it is a breaking change for server owners.
paper = "1.21.11-R0.1-SNAPSHOT"
junit = "6.1.3"
shadow = "9.6.1"
resource-factory = "1.4.0"
run-paper = "3.1.0"
minotaur = "2.10.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
resource-factory = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resource-factory" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
minotaur = { id = "com.modrinth.minotaur", version.ref = "minotaur" }
