[versions]
# The rewrite's Kotlin, for every Xena plugin at once: servers before 1.15 share the first
# plugin's stdlib, so the family moves together (DECISIONS.md, M0).
kotlin = "2.4.21"
# The oldest Paper every plugin supports. Raising it is a breaking change for server owners.
paper = "1.21.11-R0.1-SNAPSHOT"
junit = "6.1.3"
mockbukkit = "4.116.3"
bstats = "3.2.1"
placeholderapi = "2.12.3"
vault-api = "1.7.1"
# xMoney ships this inside its jar: the Vault 1 and VaultUnlocked 2 API classes.
vaultunlocked-api = "2.20"
worldguard = "7.0.14"
worldedit = "7.3.9"
# Tests only: Paper ships its own SQLite and MySQL drivers, which the plugins use.
sqlite-jdbc = "3.49.1.0"
mysql-connector = "9.2.0"
shadow = "9.6.1"
resource-factory = "1.4.0"
run-paper = "3.1.0"
minotaur = "2.10.0"
hangar-publish = "0.1.4"
# Publishes each plugin's API to Maven Central through the Central Portal, as NeoSkript does.
maven-publish = "0.37.0"
# xBackup's SFTP and FTP remotes. Never shaded: xBackup downloads the jar the first time a
# remote needs it and checks it against the SHA-256 in its Libraries class, which a test
# compares with these.
jsch = "2.28.8"
commons-net = "3.13.0"
# The copy-paste detector the root build runs across modules.
pmd = "7.29.0"
# Reads each API's class files for its signature check (build-logic), as NeoSkript does.
asm = "9.11.1"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21", version.ref = "mockbukkit" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
vault-api = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault-api" }
vaultunlocked-api = { module = "net.milkbowl.vault:VaultUnlockedAPI", version.ref = "vaultunlocked-api" }
worldguard-bukkit = { module = "com.sk89q.worldguard:worldguard-bukkit", version.ref = "worldguard" }
worldguard-core = { module = "com.sk89q.worldguard:worldguard-core", version.ref = "worldguard" }
worldedit-bukkit = { module = "com.sk89q.worldedit:worldedit-bukkit", version.ref = "worldedit" }
worldedit-core = { module = "com.sk89q.worldedit:worldedit-core", version.ref = "worldedit" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }
commons-net = { module = "commons-net:commons-net", version.ref = "commons-net" }
pmd-cli = { module = "net.sourceforge.pmd:pmd-cli", version.ref = "pmd" }
pmd-java = { module = "net.sourceforge.pmd:pmd-java", version.ref = "pmd" }
# Applied by the rewrite's conventions in build-logic (xena.kmp, xena.kotlin-jvm).
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
resource-factory = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resource-factory" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
minotaur = { id = "com.modrinth.minotaur", version.ref = "minotaur" }
hangar-publish = { id = "io.papermc.hangar-publish-plugin", version.ref = "hangar-publish" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
