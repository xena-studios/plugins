[versions]
# The rewrite's Kotlin, for every Xena plugin at once: servers before 1.15 share the first
# plugin's stdlib, so the family moves together (DECISIONS.md, M0).
kotlin = "2.4.21"
# The oldest Bukkit the rewrite runs on: the core's Java shim compiles against it, so it uses
# nothing newer (core/core-loader).
spigot-floor = "1.8.8-R0.1-SNAPSHOT"
# The oldest Paper every plugin supports. Raising it is a breaking change for server owners.
paper = "1.21.11-R0.1-SNAPSHOT"
junit = "6.1.3"
mockbukkit = "4.116.3"
bstats = "3.2.1"
placeholderapi = "2.12.3"
vault-api = "1.7.1"
# xMoney ships this inside its jar: the Vault 1 and VaultUnlocked 2 API classes.
vaultunlocked-api = "2.20"
worldguard = "7.0.14"
worldedit = "7.3.9"
# Tests only: Paper ships its own SQLite and MySQL drivers, which the plugins use.
sqlite-jdbc = "3.49.1.0"
mysql-connector = "9.2.0"
shadow = "9.6.1"
resource-factory = "1.4.0"
run-paper = "3.1.0"
minotaur = "2.10.0"
hangar-publish = "0.1.4"
# Publishes each plugin's API to Maven Central through the Central Portal, as NeoSkript does.
maven-publish = "0.37.0"
# xBackup's SFTP and FTP remotes. Never shaded: xBackup downloads the jar the first time a
# remote needs it and checks it against the SHA-256 in its Libraries class, which a test
# compares with these.
jsch = "2.28.8"
commons-net = "3.13.0"
# The copy-paste detector the root build runs across modules.
pmd = "7.29.0"
# YAML for the rewrite's configs on the JVM (core-jvm's config package): the parser kaml is
# built on, which is Java 8 bytecode where kaml is 11. No wasmWasi build yet
# (krzema12/snakeyaml-engine-kmp#523), so core-common takes a reader instead. Plugins download
# it with okio and urlencoder at startup, pinned in gradle/library-pins.txt: a bump runs the
# build with -PupdatePins.
snakeyaml-engine-kmp = "5.0.0"
# Reads each API's class files for its signature check (build-logic), as NeoSkript does.
asm = "9.11.1"
# The text APIs core-jvm draws messages to, compile-only: servers ship their own. Adventure
# 4.7.0 is what Paper 1.16.5 bundles, the oldest Adventure the renderer meets, so nothing
# newer can be called by accident. Spigot 1.8.8's bungeecord-chat (1.8-SNAPSHOT) is in no
# public repository, so the oldest release on Maven Central is used, and a test keeps the
# renderer to what 1.8 has (DECISIONS.md).
adventure-api = "4.7.0"
bungeecord-chat = "1.16-R0.4"
# The proxies' APIs, compile-only (core/platform-velocity, core/platform-bungee): the oldest each
# adapter runs on. Velocity 3.4 is the first on Java 21, and its API is the same in 4.x, which
# moved to Adventure 5; BungeeCord's API on Maven Central, Java 8 class files, with plugin.yml's
# libraries: (Waterfall's too).
velocity-api = "3.4.0"
bungeecord-api = "1.21-R0.4"
# Brigadier's API, which core-jvm's BrigadierTree builds on: Minecraft's own on Fabric,
# Velocity's fork of it there. Compile-only, Mojang's, the release Minecraft 1.20.1 (Fabric's
# oldest line) ships, so nothing newer is called.
brigadier = "1.1.8"
# What Velocity and Minecraft (1.18 on) log through, compile-only (core-jvm's Slf4jLog).
slf4j = "2.0.17"
# Shrinks the rewrite's jars (xena.r8), the version M0 proved on the spike jars. From Google's
# Maven repository, which settings.gradle.kts lists for it alone.
r8 = "9.5.33"
# Fuzzes the rewrite's parsers on the JVM (core/core-fuzz): JUnit fuzz tests, which replay
# their committed corpus in every test run and fuzz with JAZZER_FUZZ=1.
jazzer = "0.30.0"
# JMH, for the core's hot paths (core/core-benchmarks), run without a Gradle plugin: the
# plugins for it warn about Gradle 10 deprecations.
jmh = "1.37"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21", version.ref = "mockbukkit" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
vault-api = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault-api" }
vaultunlocked-api = { module = "net.milkbowl.vault:VaultUnlockedAPI", version.ref = "vaultunlocked-api" }
worldguard-bukkit = { module = "com.sk89q.worldguard:worldguard-bukkit", version.ref = "worldguard" }
worldguard-core = { module = "com.sk89q.worldguard:worldguard-core", version.ref = "worldguard" }
worldedit-bukkit = { module = "com.sk89q.worldedit:worldedit-bukkit", version.ref = "worldedit" }
worldedit-core = { module = "com.sk89q.worldedit:worldedit-core", version.ref = "worldedit" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }
commons-net = { module = "commons-net:commons-net", version.ref = "commons-net" }
pmd-cli = { module = "net.sourceforge.pmd:pmd-cli", version.ref = "pmd" }
pmd-java = { module = "net.sourceforge.pmd:pmd-java", version.ref = "pmd" }
snakeyaml-engine-kmp = { module = "it.krzeminski:snakeyaml-engine-kmp", version.ref = "snakeyaml-engine-kmp" }
# The same parser's JVM jar, which a plugin's jar names to be downloaded (xena.fetched-libraries,
# plugin.yml's libraries:) with what it needs (okio, urlencoder) rather than shading them.
snakeyaml-engine-kmp-jvm = { module = "it.krzeminski:snakeyaml-engine-kmp-jvm", version.ref = "snakeyaml-engine-kmp" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure-api" }
bungeecord-chat = { module = "net.md-5:bungeecord-chat", version.ref = "bungeecord-chat" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
bungeecord-api = { module = "net.md-5:bungeecord-api", version.ref = "bungeecord-api" }
brigadier = { module = "com.mojang:brigadier", version.ref = "brigadier" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
bstats-velocity = { module = "org.bstats:bstats-velocity", version.ref = "bstats" }
bstats-bungeecord = { module = "org.bstats:bstats-bungeecord", version.ref = "bstats" }
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
# Applied by the rewrite's conventions in build-logic (xena.kmp, xena.kotlin-jvm).
# The stdlib the rewrite's plugins download at runtime instead of shading (xena.fetched-libraries),
# pinned by SHA-256 in gradle/library-pins.txt.
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
spigot-api-floor = { module = "org.spigotmc:spigot-api", version.ref = "spigot-floor" }
r8 = { module = "com.android.tools:r8", version.ref = "r8" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-bytecode = { module = "org.openjdk.jmh:jmh-generator-bytecode", version.ref = "jmh" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
resource-factory = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resource-factory" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
minotaur = { id = "com.modrinth.minotaur", version.ref = "minotaur" }
hangar-publish = { id = "io.papermc.hangar-publish-plugin", version.ref = "hangar-publish" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
