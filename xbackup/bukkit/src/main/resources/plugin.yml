name: xBackup
version: '${version}'
main: co.xenastudios.xbackup.bukkit.XBackupBootstrap
# Ignored before 1.13; stops 1.13+ from treating the plugin as legacy.
api-version: '1.13'
folia-supported: true
description: Incremental backups that cost almost nothing, and a restore you can trust.
website: https://plugins.xenastudios.co/xbackup/
authors: [Xena Studios]
# Spigot 1.16.5 (May 2021 builds on) and Paper download these; older servers ignore the key, and
# the shim downloads them instead.
libraries:${libraries}
# No commands or permissions here: they're registered at runtime from config.yml, so every change
# to them applies on /xbackup reload.
