name: xLimits
version: '${version}'
main: co.xenastudios.xlimits.bukkit.XLimitsBootstrap
# 1.13, xLimits' floor: block data and entity tags start there.
api-version: '1.13'
folia-supported: true
description: "Farm, entity and redstone limits: caps that refuse what's new, slow crammed farms, and tell players why."
website: https://plugins.xenastudios.co/xlimits/
authors: [Xena Studios]
# Optional: xRewind, for the alerts' "who built this" button.
softdepend: [xRewind]
# Spigot 1.16.5 (May 2021 builds on) and Paper download these; older servers ignore the key,
# and the shim downloads them instead.
libraries:${libraries}
# No commands or permissions here: they're registered at runtime from config.yml, so every
# change to them applies on /xlimits reload.
