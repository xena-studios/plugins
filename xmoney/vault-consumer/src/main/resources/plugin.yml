# Never released. An ordinary plugin.yml plugin written for Vault, as shops and jobs
# plugins are: it depends on Vault, and xMoney provides it.
name: VaultConsumer
version: 0.0.0
main: co.xenastudios.xmoney.vaultconsumer.VaultConsumer
# Ignored before 1.13; 1.13 so 1.13 to the newest all load it.
api-version: "1.13"
folia-supported: true
depend: [Vault]
commands:
  vaulttest:
    description: Calls Vault the ways badly behaved plugins do, and checks the answers.
  vaultperms:
    description: Says which plugins answer Vault's Permission and Chat APIs.
