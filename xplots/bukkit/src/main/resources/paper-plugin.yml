# Paper and Folia from 1.19.3 read this instead of plugin.yml; Spigot and older Paper ignore it.
# The same plugin, with its libraries handed to Paper by the core's loader from the family's
# cache rather than resolved by Paper from plugin.yml's libraries: at every boot (DECISIONS.md).
name: xPlots
version: '${version}'
main: co.xenastudios.xplots.bukkit.XPlotsBootstrap
# The core's, relocated into the plugin's package with the rest of it.
loader: co.xenastudios.xplots.core.loader.paper.PaperLibraryLoader
api-version: '1.19'
folia-supported: true
description: Rentable plots, set up in a minute.
website: https://plugins.xenastudios.co/xplots/
authors: [Xena Studios]
dependencies:
  server:
    # Optional. The family's APIs and Vault's are called by name, through their own class
    # loaders, so none joins xPlots' classpath.
    xMoney:
      load: BEFORE
      required: false
    Vault:
      load: BEFORE
      required: false
    xTeleport:
      load: BEFORE
      required: false
    xRewind:
      load: BEFORE
      required: false
    xVanish:
      load: BEFORE
      required: false
    # Called by their own types, in classes loaded only when they're installed: their classes join.
    WorldGuard:
      load: BEFORE
      required: false
      join-classpath: true
    WorldEdit:
      load: BEFORE
      required: false
      join-classpath: true
    FastAsyncWorldEdit:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
