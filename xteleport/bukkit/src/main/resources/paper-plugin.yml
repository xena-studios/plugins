# Paper and Folia from 1.19.3 read this instead of plugin.yml; Spigot and older Paper ignore it.
# The same plugin, with its libraries handed to Paper by the core's loader from the family's
# cache rather than resolved by Paper from plugin.yml's libraries: at every boot (DECISIONS.md).
name: xTeleport
version: '${version}'
main: co.xenastudios.xteleport.bukkit.XTeleportBootstrap
# The core's, relocated into the plugin's package with the rest of it.
loader: co.xenastudios.xteleport.core.loader.paper.PaperLibraryLoader
api-version: '1.19'
folia-supported: true
description: Every teleport your server needs.
website: https://plugins.xenastudios.co/xteleport/
authors: [Xena Studios]
dependencies:
  server:
    # Optional: teleport costs. xMoney's API and Vault's are called by name, through their own
    # class loaders, so neither joins xTeleport's classpath.
    xMoney:
      load: BEFORE
      required: false
    Vault:
      load: BEFORE
      required: false
    # Optional: %xteleport_homes% and the rest, when it's installed.
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
