name: xTeleport
version: '${version}'
main: co.xenastudios.xteleport.bukkit.XTeleportBootstrap
# Ignored before 1.13; stops 1.13+ from treating the plugin as legacy.
api-version: '1.13'
folia-supported: true
description: Every teleport your server needs.
website: https://plugins.xenastudios.co/xteleport/
authors: [Xena Studios]
# Optional, each found when it's needed: costs through xMoney (or any economy registered with
# Vault), %xteleport_homes% and the rest with PlaceholderAPI. Loaded first when they're there.
softdepend: [xMoney, Vault, PlaceholderAPI]
# Spigot 1.16.5 (May 2021 builds on) and Paper download these; older servers ignore the key,
# and the shim downloads them instead.
libraries:${libraries}
# No commands or permissions here: they're registered at runtime from config.yml, so every
# change to them applies on /xteleport reload.
