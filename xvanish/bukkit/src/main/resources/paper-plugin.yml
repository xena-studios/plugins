# Paper and Folia from 1.19.3 read this instead of plugin.yml; Spigot and older Paper ignore it.
# The same plugin, with its libraries handed to Paper by the core's loader from the family's
# cache rather than resolved by Paper from plugin.yml's libraries: at every boot (DECISIONS.md).
name: xVanish
version: '${version}'
main: co.xenastudios.xvanish.bukkit.XVanishBootstrap
# The core's, relocated into the plugin's package with the rest of it.
loader: co.xenastudios.xvanish.core.loader.paper.PaperLibraryLoader
api-version: '1.19'
folia-supported: true
description: "Vanish for staff: hidden everywhere a player could notice, on Folia too."
website: https://plugins.xenastudios.co/xvanish/
authors: [Xena Studios]
dependencies:
  server:
    # Optional: %xvanish_vanished% and the rest, when it's installed.
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
